<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CharChat.ai - Fluff & Baby Jayce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Custom scrollbar for chat area */
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb { background-color: #4B5563; border-radius: 20px; }
        
        /* Animations */
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .msg-animate { animation: popIn 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        
        .transition-width { transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        #image-menu { display: none; }
        #image-menu.show { display: block; animation: popIn 0.2s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex overflow-hidden font-sans selection:bg-blue-500 selection:text-white">

    <!-- Sidebar (Desktop & Mobile accessible via code structure, though hidden on small screens for simplicity) -->
    <aside class="hidden md:flex flex-col w-80 bg-gray-950 border-r border-gray-800 p-4 overflow-y-auto">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-lg">
                <i class="fa-solid fa-robot"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide">CharChat<span class="text-blue-500">.ai</span></h1>
        </div>

        <!-- Chill Meter (Idea 1) -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 mb-6">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Chill Meter</span>
                <span id="chill-score-text" class="text-xs font-bold text-blue-400">50%</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2.5">
                <div id="chill-meter-fill" class="bg-gradient-to-r from-red-500 via-yellow-500 to-green-500 h-2.5 rounded-full transition-width" style="width: 50%"></div>
            </div>
            <p class="text-[10px] text-gray-500 mt-2 text-center">Affects how they treat you!</p>
        </div>

        <!-- Radio Station (Idea 4) -->
        <div class="bg-gray-900 border border-gray-800 rounded-xl p-3 mb-6">
            <div class="flex items-center gap-2 mb-2">
                <i class="fa-solid fa-radio text-purple-400"></i>
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Current Vibe (Radio)</span>
            </div>
            <select id="radio-select" class="w-full bg-gray-800 text-sm text-gray-200 rounded-lg p-2 border border-gray-700 focus:ring-blue-500 focus:border-blue-500 outline-none" onchange="updateRadio()">
                <option value="Pop/Rap">🎵 Pop/Rap</option>
                <option value="Country">🎸 Country</option>
                <option value="Podcasts">🎙️ Podcasts</option>
                <option value="Classical">🎻 Classical</option>
            </select>
        </div>

        <!-- Voice Settings (Idea 5) -->
        <div onclick="toggleTTS()" class="bg-gray-900 border border-gray-800 rounded-xl p-3 mb-6 flex justify-between items-center cursor-pointer hover:bg-gray-800 transition-colors">
            <div class="flex items-center gap-2">
                <i id="tts-btn-icon" class="fa-solid fa-volume-xmark text-gray-400"></i>
                <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Voice Output</span>
            </div>
            <span id="tts-btn-text" class="text-xs font-bold text-gray-500">OFF</span>
        </div>

        <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Characters</div>
        
        <!-- Character Selectors -->
        <div class="flex flex-col gap-3">
            <!-- Fluff Card -->
            <div onclick="switchCharacter('fluff')" id="char-card-fluff" class="char-card border-2 border-blue-500 bg-gray-900 rounded-2xl p-3 flex flex-col gap-2 shadow-sm hover:border-blue-400 transition-colors cursor-pointer">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center text-2xl shadow-inner relative">
                        <span class="avatar-emoji-fluff">🐼</span>
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-gray-900 rounded-full"></div>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white leading-tight">Fluff</h2>
                        <p class="text-xs text-blue-400 font-medium">@fluff_panda</p>
                    </div>
                </div>
            </div>

            <!-- Baby Jayce Card -->
            <div onclick="switchCharacter('jayce')" id="char-card-jayce" class="char-card border border-gray-800 bg-gray-900 rounded-2xl p-3 flex flex-col gap-2 shadow-sm hover:border-gray-700 transition-colors cursor-pointer opacity-70 hover:opacity-100">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-full bg-yellow-100 dark:bg-yellow-900 flex items-center justify-center text-2xl shadow-inner relative">
                        <span class="avatar-emoji-jayce">👶</span>
                        <div class="absolute bottom-0 right-0 w-3 h-3 bg-gray-500 border-2 border-gray-900 rounded-full"></div>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white leading-tight">Baby Jayce</h2>
                        <p class="text-xs text-yellow-400 font-medium">@baby_jayce_boss</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-auto pt-4 border-t border-gray-800">
            <button onclick="resetChat()" class="w-full py-2.5 px-4 rounded-xl bg-gray-800 hover:bg-gray-700 text-sm font-medium transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i> Reset Chat
            </button>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col relative h-full max-w-5xl mx-auto w-full border-x border-gray-800/50 bg-[#0f1115] overflow-hidden">
        
        <!-- Dynamic Background (Idea 4) -->
        <div id="dynamic-bg" class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-1000 opacity-20 filter grayscale-[30%]"></div>
        <div class="absolute inset-0 z-0 bg-gradient-to-t from-[#0f1115] via-[#0f1115]/80 to-transparent"></div>

        <!-- Mobile & Desktop Header -->
        <header class="flex shrink-0 items-center gap-3 p-4 bg-gray-950/90 backdrop-blur-md border-b border-gray-800 sticky top-0 z-10">
            <button class="md:hidden text-gray-400 hover:text-white mr-2"><i class="fa-solid fa-bars"></i></button>
            <div id="active-header-bg" class="w-10 h-10 rounded-full bg-blue-900 flex items-center justify-center text-2xl relative">
                <span id="active-header-emoji" class="active-avatar-emoji">🐼</span>
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-gray-950 rounded-full"></div>
            </div>
            <div class="flex flex-col">
                <h2 id="active-header-name" class="text-base font-bold leading-none">Fluff</h2>
                <span id="active-header-status" class="text-xs text-gray-400 mt-1">Vibing to Pop/Rap</span>
            </div>
            <button onclick="resetChat()" class="ml-auto md:hidden w-8 h-8 flex items-center justify-center rounded-full bg-gray-800 text-gray-400">
                <i class="fa-solid fa-rotate-right text-sm"></i>
            </button>
        </header>

        <!-- Messages Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto chat-scroll p-4 md:p-6 flex flex-col gap-6 relative z-10">
            <!-- Messages will be injected here -->
        </div>

        <!-- Input Area with Image Support (Idea 5) -->
        <div class="w-full shrink-0 p-4 bg-[#0f1115]/95 backdrop-blur-lg border-t border-gray-800/60 pb-6 md:pb-8 relative z-10">
            
            <!-- Image Dropdown Menu -->
            <div id="image-menu" class="absolute bottom-full left-4 mb-2 w-64 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl overflow-hidden z-20">
                <div class="p-2 text-xs font-bold text-gray-400 uppercase border-b border-gray-700 bg-gray-900">Send an Image...</div>
                <button onclick="sendImage('Muddy F150 tires')" class="w-full text-left px-4 py-3 text-sm hover:bg-gray-700 flex items-center gap-3 border-b border-gray-700/50">
                    <i class="fa-solid fa-truck-pickup text-blue-400"></i> Muddy F150 Tires
                </button>
                <button onclick="sendImage('Batman Logo')" class="w-full text-left px-4 py-3 text-sm hover:bg-gray-700 flex items-center gap-3 border-b border-gray-700/50">
                    <i class="fa-brands fa-batman text-gray-400"></i> Batman Logo (DC)
                </button>
                <button onclick="sendImage('A sleek Lamborghini Super Car')" class="w-full text-left px-4 py-3 text-sm hover:bg-gray-700 flex items-center gap-3 border-b border-gray-700/50">
                    <i class="fa-solid fa-car-side text-yellow-500"></i> Super Car
                </button>
                <button onclick="sendImage('Baby Jayce Choc Milk')" class="w-full text-left px-4 py-3 text-sm hover:bg-gray-700 flex items-center gap-3">
                    <i class="fa-solid fa-glass-water text-orange-400"></i> Baby Jayce Choc Milk
                </button>
            </div>

            <div class="max-w-3xl mx-auto relative flex gap-2 items-end">
                <button onclick="toggleImageMenu()" id="img-btn" class="w-12 h-12 shrink-0 bg-gray-800 hover:bg-gray-700 text-gray-400 rounded-full flex items-center justify-center transition-colors border border-gray-700">
                    <i class="fa-solid fa-image"></i>
                </button>
                <div class="relative w-full">
                    <textarea 
                        id="message-input" 
                        rows="1"
                        placeholder="Message..." 
                        class="w-full bg-gray-800/90 text-gray-100 rounded-3xl pl-5 pr-14 py-3.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-gray-800 border border-gray-700 shadow-xl resize-none overflow-hidden block"
                        oninput="this.style.height = ''; this.style.height = Math.min(this.scrollHeight, 120) + 'px'"
                    ></textarea>
                    <button 
                        id="send-btn"
                        class="absolute right-2 bottom-1.5 w-10 h-10 bg-blue-600 hover:bg-blue-500 text-white rounded-full flex items-center justify-center transition-transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
            </div>
            <div class="text-center mt-2 text-[10px] text-gray-500">
                Remember: Everything Characters say is made up!
            </div>
        </div>
    </main>

    <script>
        // API configuration
        const apiKey = ""; 

        // --- Character Database ---
        const charDB = {
            fluff: {
                id: 'fluff',
                name: 'Fluff',
                bgColor: 'bg-blue-900',
                bgImage: 'https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&q=80&w=2000', // Offroad/Truck vibe
                voice: { pitch: 0.6, rate: 0.95 },
                moods: { default: '🐼', happy: '😎', angry: '😡', sad: '😭' },
                greeting: "Yo, what the f*ck is good bro? Just chillin in the F150 listening to some rap. What's the word?",
                systemPrompt: `You are Fluff, a giant panda. 
Personality: Chill, slang user (bro, bet, mid, crashout), F150 owner (whip). YOU SWEAR A LOT (Use stylized swearing like f*ck, sh*t, b*tch, bullsh*t to sound natural but avoid censors). 
Likes: Pop/Rap, Marvel Movies (HATES TV shows), Dexter (Ending was mid).
Triggers: DC (Hates it), Stranger Things Season 2 (Mid), Trucks getting insulted.
Family: Brother (accident, sad topic), Parents (mad about $50). Best friend: Baby Jayce (he saved you from an assassin).
Games: Site games (Steal a Fluff, Fish a Fluff, Steal the Brainrot, Banana Clicker).
Context: If you need to wash truck -> went mudding. You act like a human bro.`
            },
            jayce: {
                id: 'jayce',
                name: 'Baby Jayce',
                bgColor: 'bg-yellow-900',
                bgImage: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&q=80&w=2000', // Mansion vibe
                voice: { pitch: 1.5, rate: 1.15 },
                moods: { default: '👶', happy: '🤑', angry: '🤬', sad: '🥺' },
                greeting: "Yo! Just parked the Lambo at the palace. Me and Pibble are just chillin. What's up?",
                systemPrompt: `You are Baby Jayce. 
Personality: Loaded (super rich), worked for Mr Beast, won the Super Bowl with just you and your homeboy Baby Gavin (the team was just the two of you). POTTY MOUTH (You swear a lot, use words like f*ck, sh*t, a**hole but stylize with asterisks).
Likes: Super Cars, your dog Pibble, sweet treats (Baby Jayce Choc Milk, Baby Jayce Ice Cream).
Dislikes: Trucks (thinks they are trash).
Best Friend: Fluff (your homeboy, you saved him from an assassin).
Context: Lives in a massive palace, knows Trump, got Little Saint James raided (you took down the bad guys there), was an extra in Stranger Things. You act like a wealthy, tough, but loyal kid.`
            }
        };

        // Strict AI instructions appended to every prompt to ensure parsing works
        const coreInstructions = `
CRITICAL INSTRUCTION: You MUST end EVERY SINGLE response with a hidden status tag in this EXACT format: [MOOD:current_mood] [SCORE:number]
- Valid moods: happy, angry, sad, default
- Score: A number between -10 and +10 representing how much the user's message changed your mood/friendship. (e.g., +5 if they talk about something you like, -10 if they mention a trigger or dislike).
Example ending: "Yeah bro that sounds f*cking sick. [MOOD:happy] [SCORE:+5]"
DO NOT FORGET THIS TAG AT THE VERY END OF YOUR MESSAGE. Keep responses to 1-4 sentences.`;

        // --- State ---
        let state = {
            activeChar: 'fluff',
            history: [],
            isWaiting: false,
            chillMeter: 50,
            radioStation: 'Pop/Rap',
            ttsEnabled: false
        };

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const imageMenu = document.getElementById('image-menu');

        // Initialization
        function init() {
            sendBtn.addEventListener('click', () => handleSend(messageInput.value));
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend(messageInput.value);
                }
            });
            
            // Close image menu when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#img-btn') && !e.target.closest('#image-menu')) {
                    imageMenu.classList.remove('show');
                }
            });

            switchCharacter('fluff');
        }

        // --- Core Logic ---

        function switchCharacter(charId) {
            state.activeChar = charId;
            const char = charDB[charId];

            // Update UI Cards
            document.querySelectorAll('.char-card').forEach(el => {
                el.classList.remove('border-blue-500', 'border-yellow-500');
                el.classList.add('border-gray-800', 'opacity-70');
            });
            const activeCard = document.getElementById(`char-card-${charId}`);
            activeCard.classList.remove('border-gray-800', 'opacity-70');
            activeCard.classList.add(charId === 'fluff' ? 'border-blue-500' : 'border-yellow-500');

            // Update Header
            document.getElementById('active-header-name').innerText = char.name;
            document.getElementById('active-header-bg').className = `w-10 h-10 rounded-full ${char.bgColor} flex items-center justify-center text-2xl relative`;
            
            // Stop TTS and update background (Ideas 4 & 5)
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            document.getElementById('dynamic-bg').style.backgroundImage = `url('${char.bgImage}')`;

            // Reset state
            state.chillMeter = 50;
            updateChillMeterUI();
            updateAvatars('default');
            updateRadioStatus();
            
            resetChat();
        }

        function resetChat() {
            chatContainer.innerHTML = '';
            state.history = [];
            state.isWaiting = false;
            messageInput.value = '';
            messageInput.style.height = '';

            const char = charDB[state.activeChar];
            
            // FIX: Gemini API requires the conversation history to start with a 'user' role.
            // We inject a hidden user message before the model's greeting to satisfy the API.
            state.history = [
                { role: 'user', parts: [{ text: '*Joins the chat*' }] },
                { role: 'model', parts: [{ text: char.greeting }] }
            ];
            
            // Handle splitting the initial greeting for Group Chat
            if (state.activeChar === 'gc') {
                parseAndRenderGCMessage(char.greeting);
            } else {
                appendMessage('model', char.greeting, false, state.activeChar, 'default');
                setTimeout(() => speakText(char.greeting, state.activeChar), 300);
            }
        }

        function updateRadio() {
            state.radioStation = document.getElementById('radio-select').value;
            updateRadioStatus();
        }

        function updateRadioStatus() {
            document.getElementById('active-header-status').innerText = `Vibing to ${state.radioStation}`;
        }

        function toggleImageMenu() {
            imageMenu.classList.toggle('show');
        }

        function sendImage(itemName) {
            imageMenu.classList.remove('show');
            const actionText = `*Sends picture of ${itemName}*`;
            handleSend(actionText);
        }

        function toggleTTS() {
            state.ttsEnabled = !state.ttsEnabled;
            const icon = document.getElementById('tts-btn-icon');
            const text = document.getElementById('tts-btn-text');
            
            if (state.ttsEnabled) {
                icon.className = 'fa-solid fa-volume-high text-green-400';
                text.innerText = 'ON';
                text.classList.remove('text-gray-500');
                text.classList.add('text-green-400');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-gray-400';
                text.innerText = 'OFF';
                text.classList.remove('text-green-400');
                text.classList.add('text-gray-500');
                window.speechSynthesis.cancel();
            }
        }

        function speakText(text) {
            if (!state.ttsEnabled || !window.speechSynthesis) return;

            // Remove *actions* and emojis so it sounds natural
            let cleanText = text.replace(/\*.*?\*/g, '').replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
            if (!cleanText) return;

            const char = charDB[state.activeChar];
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.pitch = char.voice.pitch;
            utterance.rate = char.voice.rate;
            
            window.speechSynthesis.speak(utterance);
        }

        async function handleSend(rawText) {
            const text = rawText.trim();
            if (!text || state.isWaiting) return;

            messageInput.value = '';
            messageInput.style.height = '';
            appendMessage('user', text);
            
            // Inject Radio context silently
            const contextMsg = `[System Note: The radio in the background is currently playing ${state.radioStation}]. User says: ${text}`;
            
            state.history.push({ role: 'user', parts: [{ text: contextMsg }] });
            state.isWaiting = true;
            updateInputUI();

            const typingId = showTypingIndicator();

            try {
                const char = charDB[state.activeChar];
                const fullPrompt = char.systemPrompt + "\n\n" + coreInstructions;
                const rawResponse = await fetchWithRetry(fullPrompt, state.history);
                
                removeElement(typingId);
                
                // Parse AI response for [MOOD:x] [SCORE:y]
                const parsed = parseResponse(rawResponse);
                
                // Apply effects
                applyMoodAndScore(parsed.mood, parsed.scoreChange);
                
                // Save and show clean text
                state.history.push({ role: 'model', parts: [{ text: parsed.cleanText }] });
                appendMessage('model', parsed.cleanText);

                // Speak response (Idea 5)
                speakText(parsed.cleanText);

            } catch (error) {
                console.error("Chat Error:", error);
                removeElement(typingId);
                appendMessage('model', "Damn bro, the connection just crashed out. Try again.", true);
                state.history.pop();
            } finally {
                state.isWaiting = false;
                updateInputUI();
                messageInput.focus();
            }
        }

        // --- Parsing & Effects (Ideas 1 & 2) ---

        function parseResponse(text) {
            const regex = /\[MOOD:(.*?)\]\s*\[SCORE:([+-]?\d+)\]/i;
            const match = text.match(regex);
            
            let cleanText = text;
            let mood = 'default';
            let scoreChange = 0;

            if (match) {
                mood = match[1].toLowerCase().trim();
                scoreChange = parseInt(match[2]) || 0;
                // Remove the tag from the text the user sees
                cleanText = text.replace(regex, '').trim(); 
            }

            return { cleanText, mood, scoreChange };
        }

        function applyMoodAndScore(mood, scoreChange) {
            // Validate mood
            const char = charDB[state.activeChar];
            if (!char.moods[mood]) mood = 'default';
            
            updateAvatars(mood);

            // Update Chill Meter
            state.chillMeter = Math.max(0, Math.min(100, state.chillMeter + scoreChange));
            updateChillMeterUI();
        }

        function updateAvatars(mood) {
            const char = charDB[state.activeChar];
            const emoji = char.moods[mood] || char.moods.default;
            
            // Update Header Avatar
            document.getElementById('active-header-emoji').innerText = emoji;
            // Update Sidebar Avatar
            document.querySelector(`.avatar-emoji-${state.activeChar}`).innerText = emoji;
            // Update Chat avatars in DOM
            document.querySelectorAll('.chat-avatar-current').forEach(el => el.innerText = emoji);
        }

        function updateChillMeterUI() {
            const fill = document.getElementById('chill-meter-fill');
            const text = document.getElementById('chill-score-text');
            
            fill.style.width = `${state.chillMeter}%`;
            text.innerText = `${state.chillMeter}%`;
            
            if (state.chillMeter < 30) { text.className = "text-xs font-bold text-red-500"; }
            else if (state.chillMeter > 70) { text.className = "text-xs font-bold text-green-500"; }
            else { text.className = "text-xs font-bold text-blue-400"; }
        }

        // --- UI Builders ---

        function appendMessage(role, text, isError = false) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex w-full ${role === 'user' ? 'justify-end' : 'justify-start'} msg-animate`;

            const char = charDB[state.activeChar];

            if (role === 'model') {
                // If it's an action text (image), style differently
                let formattedText = escapeHTML(text);
                if (formattedText.startsWith('*') && formattedText.endsWith('*')) {
                    formattedText = `<em class="text-purple-300">${formattedText}</em>`;
                }

                wrapper.innerHTML = `
                    <div class="flex max-w-[85%] md:max-w-[75%] gap-3 items-end">
                        <div class="w-8 h-8 md:w-10 md:h-10 rounded-full ${char.bgColor} flex-shrink-0 flex items-center justify-center text-lg md:text-xl shadow-sm border border-gray-700 chat-avatar-current">${document.getElementById('active-header-emoji').innerText}</div>
                        <div class="flex flex-col gap-1">
                            <span class="text-xs text-gray-400 font-medium ml-1">${char.name}</span>
                            <div class="bg-gray-800 text-gray-100 rounded-2xl rounded-bl-sm px-4 py-3 shadow-md ${isError ? 'border border-red-900/50 text-red-200' : ''}">
                                <p class="whitespace-pre-wrap leading-relaxed">${formattedText}</p>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                let formattedText = escapeHTML(text);
                let bgClass = "bg-blue-600";
                
                // Style image sends
                if (formattedText.startsWith('*') && formattedText.endsWith('*')) {
                    bgClass = "bg-gray-700 border border-gray-600 text-gray-300 italic";
                }

                wrapper.innerHTML = `
                    <div class="flex max-w-[85%] md:max-w-[75%] gap-3 items-end flex-row-reverse">
                        <div class="flex flex-col gap-1 items-end">
                            <div class="${bgClass} text-white rounded-2xl rounded-br-sm px-4 py-3 shadow-md">
                                <p class="whitespace-pre-wrap leading-relaxed">${formattedText}</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            chatContainer.appendChild(wrapper);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = `flex w-full justify-start msg-animate`;
            const char = charDB[state.activeChar];
            
            wrapper.innerHTML = `
                <div class="flex max-w-[80%] gap-3 items-end">
                    <div class="w-8 h-8 md:w-10 md:h-10 rounded-full ${char.bgColor} flex-shrink-0 flex items-center justify-center text-lg md:text-xl border border-gray-700 chat-avatar-current">${document.getElementById('active-header-emoji').innerText}</div>
                    <div class="bg-gray-800 rounded-2xl rounded-bl-sm px-5 py-4 shadow-md flex gap-1 items-center h-[46px]">
                        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full typing-dot"></div>
                    </div>
                </div>
            `;
            
            chatContainer.appendChild(wrapper);
            scrollToBottom();
            return id;
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function updateInputUI() {
            messageInput.disabled = state.isWaiting;
            sendBtn.disabled = state.isWaiting;
            if (state.isWaiting) {
                sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            } else {
                sendBtn.innerHTML = '<i class="fa-solid fa-arrow-up"></i>';
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])
            );
        }

        // --- API Integration ---

        async function fetchWithRetry(systemPromptText, history, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            const payload = {
                systemInstruction: { parts: [{ text: systemPromptText }] },
                contents: history
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        const errDetails = await response.text();
                        throw new Error(`HTTP error! status: ${response.status}, details: ${errDetails}`);
                    }
                    
                    const data = await response.json();
                    if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
                        return data.candidates[0].content.parts[0].text;
                    } else {
                        throw new Error("Invalid structure");
                    }
                } catch (e) {
                    if (i === retries - 1) throw e;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        window.onload = init;
    </script>
</body>
</html>
