<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fluff Forest: Tycoon</title>
    <style>

        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Fredoka One', cursive; touch-action: none; user-select: none; background-color: #000; }
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; z-index: 10; }
        .header-container { display: flex; flex-direction: column; align-items: center; width: 100%; pointer-events: none; }
        .game-title { font-size: 3rem; color: #fff; text-shadow: 3px 3px 0px #2E7D32, 5px 5px 10px rgba(0,0,0,0.5); margin: 0; letter-spacing: 2px; }

        .controls-area { display: flex; gap: 15px; align-self: flex-end; pointer-events: auto; }
        .ui-btn { background: #FF9800; color: #fff; border: 3px solid #E65100; padding: 10px 25px; font-size: 1.2rem; border-radius: 15px; cursor: pointer; font-family: 'Fredoka One', cursive; box-shadow: 0 5px 0 #E65100; transition: transform 0.1s; display: flex; align-items: center; gap: 8px; }
        .ui-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #E65100; }
        .btn-achieve { background: #9C27B0; border-color: #7B1FA2; box-shadow: 0 5px 0 #7B1FA2; }
        .btn-pedia { background: #8D6E63; border-color: #5D4037; box-shadow: 0 5px 0 #3E2723; }
        .btn-camp { background: #558B2F; border-color: #33691E; box-shadow: 0 5px 0 #33691E; }
        .btn-save { background: #4CAF50; border-color: #2E7D32; box-shadow: 0 5px 0 #2E7D32; }
        .btn-prestige { background: #00E5FF; border-color: #00B8D4; box-shadow: 0 5px 0 #00B8D4; color: #006064; }
        .btn-travel { background: #3F51B5; border-color: #303F9F; box-shadow: 0 5px 0 #1A237E; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 90; pointer-events: auto; }
        .modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 800px; max-height: 85vh; background: #FFF3E0; border: 5px solid #5D4037; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; pointer-events: auto; z-index: 100; overflow-y: auto; }
        .modal-header { font-size: 2rem; color: #5D4037; margin-bottom: 15px; width: 100%; text-align: center; border-bottom: 2px solid #D7CCC8; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

        #admin-modal { background: #212121; border: 2px solid #00E676; color: #00E676; font-family: monospace; }
        #admin-modal .modal-header { color: #00E676; border-color: #00E676; font-family: 'Fredoka One'; }
        #admin-login { display: flex; flex-direction: column; gap: 10px; width: 100%; align-items: center; }
        #admin-controls { display: none; width: 100%; flex-direction: column; gap: 15px; }

        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; width: 100%; }
        .shop-item { background: #fff; border: 2px solid #8D6E63; border-radius: 10px; padding: 10px; text-align: center; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .shop-item h3 { margin: 5px 0; font-size: 1rem; color: #3E2723; }
        .shop-item p { margin: 0 0 5px 0; font-size: 0.8rem; color: #5D4037; }
        .item-price { color: #2E7D32; font-size: 1.1rem; margin-bottom: 5px; }
        .buy-btn { background: #4CAF50; color: white; border: none; padding: 8px; border-radius: 10px; cursor: pointer; width: 100%; font-family: inherit; }
        .buy-btn.owned { background: #2196F3; }
        .buy-btn.equipped { background: #555; cursor: default; }
        .buy-btn:disabled { background: #ccc; cursor: not-allowed; }
        .achieve-list { width: 100%; display: flex; flex-direction: column; gap: 10px; }
        .achieve-item { background: #fff; padding: 10px; border-radius: 10px; border: 2px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .achieve-item.unlocked { border-color: #FFD700; background: #FFFDE7; }
        .achieve-title { font-size: 1.1rem; }
        .achieve-desc { font-size: 0.8rem; color: #666; }
        .achieve-status { font-size: 1.5rem; color: #ccc; }
        .achieve-item.unlocked .achieve-status { color: #FFD700; }
        .pedia-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; width: 100%; }
        .pedia-card { background: #fff; border: 2px solid #5D4037; border-radius: 10px; padding: 10px; }
        .pedia-head { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 5px; }
        .pedia-name { font-size: 1.2rem; color: #3E2723; }
        .pedia-total { color: #888; font-size: 0.9rem; }
        .rarity-row { display: flex; flex-wrap: wrap; gap: 5px; }
        .rarity-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; color: white; opacity: 0.3; border: 1px solid #ccc; }
        .rarity-badge.unlocked { opacity: 1; border-color: transparent; box-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
        .hidden { display: none !important; }
        #notification-area { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; pointer-events: none; z-index: 20; }
        .notif { background: rgba(0,0,0,0.8); color: #FFD700; padding: 10px 20px; border-radius: 20px; border: 2px solid #FFD700; animation: notifFade 3s forwards; }
        @keyframes notifFade { 0% { opacity: 0; transform: translateY(20px); } 10% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; } }
        .buff-container { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; }
        .active-buff { background: rgba(255, 87, 34, 0.9); color: white; padding: 10px; border-radius: 10px; border: 2px solid white; animation: pulse 1s infinite; font-size: 0.9rem; }
        .clock-buff { background: rgba(48, 63, 159, 0.9); animation: none; border-color: #7986CB; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #boss-health-container { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); width: 300px; height: 20px; background: #333; border: 2px solid #fff; border-radius: 10px; display: none; }
        #boss-health-bar { width: 100%; height: 100%; background: #D50000; border-radius: 8px; transition: width 0.1s; }
        #boss-name { position: absolute; top: -25px; width: 100%; text-align: center; color: #D50000; font-size: 1.2rem; text-shadow: 1px 1px 0 #fff; }
        #conn-status { position: absolute; top: 10px; right: 10px; width: 12px; height: 12px; border-radius: 50%; background: red; border: 2px solid white; z-index: 20; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
        #conn-status.online { background: #00E676; }
        #conn-status.loading { background: #FFEB3B; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div class="buff-container">

                <button onclick="adminAdd('gem')" class="admin-btn">Add Gems</button>

            <div class="admin-row">

        const achievements = [
            { id: 'hunt1', title: "First Hunt", desc: "Kill 1 animal", achieved: false, check: () => killCount >= 1 },
            { id: 'hunt100', title: "Seasoned Hunter", desc: "Kill 100 animals", achieved: false, check: () => killCount >= 100 },
            { id: 'cash1k', title: "Making Bank", desc: "Earn $1,000", achieved: false, check: () => cash >= 1000 },

        ];

        // --- 5. CLASSES ---

        class Entity {
            constructor(type, isBoss = false) {
                this.type = type;
                this.isBoss = isBoss;
                const stats = speciesConfig[type];
                this.stats = stats;
                this.rarity = rarities[0];
                
                if (isBoss) {
                    this.rarity = rarities[5];
                    this.maxHp = 50000 * (1 + prestigeLevel);
                    this.currentHp = this.maxHp;
                    this.value = 0;
                    this.scale = 3.0;
                    this.speedX = 0.5;
                } else {
                    let rStart = stats.rare ? 2 : 0;
                    let subList = rarities.slice(rStart);
                    let totalW = subList.reduce((a,b) => a + b.chance, 0);
                    let random = Math.random() * totalW;
                    let sum = 0;
                    for(let r of subList) { sum += r.chance; if(random<=sum){this.rarity=r; break;} }
                    if(baitActive && !stats.rare && this.rarity.name==="Common" && Math.random()>0.3) this.rarity=rarities[1];

                    this.scale = stats.scale * (type==='deer'?(1+rarities.indexOf(this.rarity)*0.1):1);
                    this.maxHp = Math.floor(stats.hpBase * this.rarity.hpMod);
                    this.currentHp = this.maxHp;
                    this.value = Math.floor(stats.valBase * this.rarity.valMod);
                    this.speedX = (Math.random()*0.5+0.5)*stats.speed;
                }

                this.radius = 30 * this.scale;
                this.x = -150;
                let ySpread = (type==='bird'||type==='owl'||type==='heron'||type==='parrot')?100:150;
                this.y = (canvas.height-200) + Math.random()*ySpread + (stats.yOffset||0);
                this.bobOffset = Math.random()*10;
                this.hitTime = 0; this.marked = false;
            }
            update() {
                this.x += this.speedX;
                if(this.type==='rabbit'||this.type==='penguin'||this.type==='frog') this.y+=Math.sin(Date.now()*0.01+this.bobOffset)*1.5;
                else if(this.type==='bird'||this.type==='owl'||this.type==='heron'||this.type==='parrot'||this.type==='monkey') this.y+=Math.sin(Date.now()*0.005+this.bobOffset)*1.0;
                else this.y+=Math.sin(Date.now()*0.002+this.bobOffset)*0.2;
                
                if(!this.isBoss && this.rarity.shake) this.x+=(Math.random()-0.5)*3;
                if(this.x > canvas.width+150) this.marked=true;
            }
            hit(dmg, isCrit) {
                this.currentHp -= dmg; this.hitTime = Date.now();
                let col = isCrit?"#FF1744":"#FFEB3B";
                particles.push(new TextParticle(this.x, this.y-40*this.scale, `-${dmg}${isCrit?'!':''}`, col, 1));
                if(this.currentHp<=0) this.die();
            }
            die() {
                this.marked = true; 
                if (this.isBoss) {
                    bossActive = false; bossSpawnTimer = 300;
                    els.bossHealthContainer.style.display = 'none';
                    gems += 5; notif("ALPHA DEFEATED! +5 GEMS");
                    createExplosion(this.x, this.y, "#FFD700");
                    particles.push(new TextParticle(this.x, this.y-100, "+5 GEMS", "#E91E63", 2));
                    updateHUD(); return;
                }
                killCount++;
                if(rarities.indexOf(this.rarity)>=4) hasKilledMythic=true;
                if(!animalStats[this.type]) animalStats[this.type] = {};
                if(!animalStats[this.type][this.rarity.name]) animalStats[this.type][this.rarity.name] = 0;
                animalStats[this.type][this.rarity.name]++;
                checkAchievements();
                let earn = Math.floor(this.value * prestigeMultiplier);
                if(gearOwned.petDog) earn = Math.floor(earn * 1.5);
                cash+=earn; updateHUD();
                createExplosion(this.x, this.y, this.rarity.color);
                particles.push(new TextParticle(this.x, this.y-80, `+$${earn.toLocaleString()}`, "#00E676", 1.5));
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.scale, this.scale);
                if(Date.now()-this.hitTime<100) { ctx.globalCompositeOperation="source-atop"; ctx.fillStyle="white"; }
                if(this.rarity.glow) { ctx.shadowBlur=20; ctx.shadowColor=this.rarity.color; }
                let col = this.rarity.color;
                if(this.rarity.rainbow) {
                    let g = ctx.createLinearGradient(-20,-20,20,20);
                    g.addColorStop(0, `hsl(${Date.now()/10%360},100%,50%)`); g.addColorStop(1,"white"); col=g;
                }
                
                if(this.isBoss) {
                    ctx.shadowBlur = 30; ctx.shadowColor = "red";
                    if(currentWorldId==='tundra') this.drawPolar(col);
                    else if(currentWorldId==='swamp') this.drawCroc(col);
                    else if(currentWorldId==='jungle') this.drawGorilla(col);
                    else this.drawBear(col);
                } else {
                    if(this.type==='deer') this.drawDeer(col);
                    else if(this.type==='rabbit') this.drawRabbit(col);
                    else if(this.type==='bird') this.drawBird(col);
                    else if(this.type==='wolf') this.drawWolf(col);
                    else if(this.type==='owl') this.drawOwl(col);
                    else if(this.type==='bear') this.drawBear(col);
                    else if(this.type==='penguin') this.drawPenguin(col);
                    else if(this.type==='fox') this.drawFox(col);
                    else if(this.type==='polar') this.drawPolar(col);
                    else if(this.type==='frog') this.drawFrog(col);
                    else if(this.type==='croc') this.drawCroc(col);
                    else if(this.type==='heron') this.drawBird(col);
                    else if(this.type==='moose') this.drawMoose(col);
                    else if(this.type==='monkey') this.drawMonkey(col);
                    else if(this.type==='tiger') this.drawTiger(col);
                    else if(this.type==='parrot') this.drawParrot(col);
                    else if(this.type==='gorilla') this.drawGorilla(col);
                }
                ctx.restore();
                
                if(!this.isBoss && this.currentHp<this.maxHp) {
                    let p = Math.max(0, this.currentHp/this.maxHp);
                    ctx.fillStyle="black"; ctx.fillRect(this.x-20,this.y-50*this.scale,40,6);
                    ctx.fillStyle=p>0.5?"#00E676":"#FF1744"; ctx.fillRect(this.x-19,this.y-49*this.scale,38*p,4);
                }
            }
            // --- Draw Methods ---
            drawDeer(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(20,-20,15,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(25,-22,2,0,Math.PI*2); ctx.fill(); ctx.fillStyle=c; ctx.fillRect(-10,10,5,20); ctx.fillRect(10,10,5,20); ctx.strokeStyle="#5D4037"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(20,-30); ctx.lineTo(20,-50); ctx.lineTo(10,-60); ctx.stroke(); ctx.beginPath(); ctx.moveTo(20,-30); ctx.lineTo(30,-50); ctx.lineTo(40,-60); ctx.stroke(); }
            drawMoose(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,0,30,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(30,-20,20,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#D7CCC8"; ctx.beginPath(); ctx.arc(30,-45,15,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(35,-25,3,0,Math.PI*2); ctx.fill(); ctx.fillStyle=c; ctx.fillRect(-15,20,8,30); ctx.fillRect(15,20,8,30); }
            drawRabbit(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(10,-10,10,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(8,-25,4,10,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(12,-12,2,0,Math.PI*2); ctx.fill(); }
            drawBird(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,15,10,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="white"; ctx.beginPath(); ctx.ellipse(5,-5,10,5,-0.5,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#FFC107"; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(20,0); ctx.lineTo(10,5); ctx.fill(); }
            drawWolf(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,25,15,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(20,-10,12,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.moveTo(15,-20); ctx.lineTo(25,-30); ctx.lineTo(30,-15); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(24,-12,2,0,Math.PI*2); ctx.fill(); ctx.fillStyle=c; ctx.fillRect(-15,10,5,15); ctx.fillRect(15,10,5,15); }
            drawOwl(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,20,25,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="white"; ctx.beginPath(); ctx.arc(-8,-10,8,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(8,-10,8,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(-8,-10,3,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(8,-10,3,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#FF9800"; ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(-4,0); ctx.lineTo(4,0); ctx.fill(); }
            drawBear(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,40,30,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(35,-15,20,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(25,-30,6,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(45,-30,6,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(40,-20,3,0,Math.PI*2); ctx.fill(); ctx.fillStyle=c; ctx.fillRect(-20,20,10,20); ctx.fillRect(20,20,10,20); }
            drawPolar(c) { this.drawBear(c); }
            drawPenguin(c) { ctx.fillStyle="white"; ctx.beginPath(); ctx.ellipse(0,0,15,25,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.ellipse(0,0,15,25,0,Math.PI,Math.PI*2); ctx.fill(); ctx.fillStyle="orange"; ctx.beginPath(); ctx.moveTo(5,-20); ctx.lineTo(15,-18); ctx.lineTo(5,-15); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(8,-20,2,0,Math.PI*2); ctx.fill(); }
            drawFox(c) { ctx.fillStyle="#ECEFF1"; if(c!==rarities[0].color) ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,25,12,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(20,-5,10,0,Math.PI*2); ctx.fill(); ctx.fillStyle="white"; ctx.beginPath(); ctx.moveTo(-25,0); ctx.lineTo(-45,-5); ctx.lineTo(-45,5); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(24,-7,2,0,Math.PI*2); ctx.fill(); }
            drawCroc(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.rect(-40,-10,80,20); ctx.fill(); ctx.beginPath(); ctx.moveTo(40,-5); ctx.lineTo(70,0); ctx.lineTo(40,5); ctx.fill(); ctx.fillStyle="#1B5E20"; ctx.beginPath(); ctx.moveTo(-40,0); ctx.lineTo(-70,0); ctx.stroke(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(45,-8,2,0,Math.PI*2); ctx.fill(); }
            drawFrog(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill(); ctx.fillStyle="white"; ctx.beginPath(); ctx.arc(5,-5,4,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(5,-5,2,0,Math.PI*2); ctx.fill(); }
            drawMonkey(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(0,-15,12,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#D7CCC8"; ctx.beginPath(); ctx.arc(0,-12,8,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(-4,-14,2,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(4,-14,2,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=c; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-5,10); ctx.quadraticCurveTo(-20,10, -20,-10); ctx.stroke(); }
            drawTiger(c) { ctx.fillStyle=c; ctx.fillRect(-30,-15,60,30); ctx.fillStyle="#000"; ctx.fillRect(-10,-15,5,30); ctx.fillRect(10,-15,5,30); ctx.fillStyle=c; ctx.beginPath(); ctx.arc(35,-5,15,0,Math.PI*2); ctx.fill(); ctx.fillStyle="white"; ctx.beginPath(); ctx.arc(40,-2,5,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.beginPath(); ctx.arc(42,-4,2,0,Math.PI*2); ctx.fill(); }
            drawParrot(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,15,10,0,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#FFEB3B"; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(20,0); ctx.lineTo(15,8); ctx.fill(); ctx.fillStyle="#4CAF50"; ctx.beginPath(); ctx.ellipse(0,-5,12,6,-0.5,0,Math.PI*2); ctx.fill(); }
            drawGorilla(c) { ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(0,0,45,35,0,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(0,-30,20,0,Math.PI*2); ctx.fill(); ctx.fillStyle="#BDBDBD"; ctx.beginPath(); ctx.arc(0,-35,15,0,Math.PI*2); ctx.fill(); ctx.fillStyle="black"; ctx.fillRect(-40,10,15,40); ctx.fillRect(25,10,15,40); }
        }

        class TextParticle {
            constructor(x, y, text, color, speed) { this.x=x; this.y=y; this.text=text; this.color=color; this.life=1.0; this.vy=-1-speed; }
            update() { this.y+=this.vy; this.life-=0.02; }
            draw() { ctx.save(); ctx.globalAlpha=this.life; ctx.font="bold 20px 'Fredoka One'"; ctx.fillStyle=this.color; ctx.strokeStyle="black"; ctx.lineWidth=3; ctx.strokeText(this.text,this.x,this.y); ctx.fillText(this.text,this.x,this.y); ctx.restore(); }
        }

        class Particle {
            constructor(x, y, color) { this.x=x; this.y=y; this.color=color; let a=Math.random()*Math.PI*2; let s=Math.random()*5+2; this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s; this.life=1; }
            update() { this.x+=this.vx; this.y+=this.vy; this.life-=0.03; }
            draw() { ctx.globalAlpha=this.life; ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,3,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1; }
        }

        // --- 6. LOGIC FUNCTIONS ---

        function spawnEntity() {
            if(bossActive) return; 
            let roll = Math.random();
            let type = '';
            
            if(currentWorldId === 'tundra') {
                if(roll < 0.02) type = 'polar';
                else type = Math.random() > 0.6 ? 'penguin' : 'fox';
            } else if(currentWorldId === 'swamp') {
                if(roll < 0.05) type = 'croc';
                else type = Math.random() > 0.5 ? 'frog' : 'heron';
            } else if(currentWorldId === 'jungle') {
                if(roll < 0.02) type = 'gorilla';
                else if(roll < 0.1) type = 'tiger';
                else type = Math.random() > 0.5 ? 'monkey' : 'parrot';
            } else {
                // Forest
                if(roll<0.02) type='bear';
                else if(roll<0.04) type='moose';
                else if(isNight) type=Math.random()>0.5?'wolf':'owl';
                else type=Math.random()>0.6?'deer':(Math.random()>0.5?'rabbit':'bird');
            }
            entities.push(new Entity(type));
        }

        function spawnBoss() {
            bossActive = true;
            let type = 'bear';
            if(currentWorldId === 'tundra') type = 'polar';
            if(currentWorldId === 'swamp') type = 'croc';
            if(currentWorldId === 'jungle') type = 'gorilla';
            bossEntity = new Entity(type, true);
            bossEntity.x = -100; 
            entities.push(bossEntity);
            els.bossHealthContainer.style.display = 'block';
            notif("THE ALPHA IS HERE!");
        }

        function updateWorldVisuals() {
            const w = worlds.find(x => x.id === currentWorldId);
            if(w) els.worldTitle.textContent = w.name;
            resize();
        }

        function notif(msg) {
            const div = document.createElement('div'); div.className='notif'; div.innerText=msg;
            els.notifArea.appendChild(div); setTimeout(()=>div.remove(),3000);
        }

        function updateHUD() {
            els.cash.textContent = Math.floor(cash).toLocaleString();
            els.gem.textContent = gems.toLocaleString();
            els.wep.textContent = currentWeapon.name;
            els.pres.textContent = prestigeLevel;
            if(cash>=1000000) els.prestigeBtn.classList.remove('hidden');
            else els.prestigeBtn.classList.add('hidden');
            
            // Update Status Dot
            els.connStatus.className = userId ? 'online' : (initialLoadDone ? '' : 'loading');
            els.connStatus.title = userId ? "Online" : "Offline";
        }

        function createExplosion(x, y, color) {
            for(let i=0; i<10; i++) particles.push(new Particle(x, y, color));
        }

        function checkAchievements() {
            achievements.forEach(a => {
                if(!a.achieved && a.check()) { a.achieved=true; notif(`🏆 Unlocked: ${a.title}`); }
            });
        }

        // Admin
        window.adminAdd = (type) => {
            let amt = parseInt(els.adminAmt.value) || 0;
            if(type === 'cash') cash += amt; if(type === 'gem') gems += amt;
            updateHUD(); notif("Admin: Added " + amt);
        };
        window.adminSpawn = (count) => {
            let type = els.adminSpawnSelect.value;
            for(let i=0; i<count; i++) {
                let e = new Entity(type); e.x = Math.random() * canvas.width; entities.push(e);
            }
            notif("Admin: Spawned " + count);
        };
        window.adminUnlock = (type) => {
            if(type === 'worlds') worlds.forEach(w => { if(!w.locked && !worldsUnlocked.includes(w.id)) worldsUnlocked.push(w.id); });
            if(type === 'guns') weapons.forEach(w => w.owned = true);
            notif("Admin: Unlocked " + type); saveGame(true);
        };
        window.adminBoss = () => { spawnBoss(); notif("Admin: Boss"); };
        window.adminTime = () => { window.timeOffset = (window.timeOffset || 0) + 30000; };
        window.doPrestige = () => {
            if(cash<1000000) return;
            cash=0; prestigeLevel++; prestigeMultiplier=1+(prestigeLevel*0.5);
            weapons.forEach(w=>{if(w.id!=='rifle_start')w.owned=false;});
            currentWeapon=weapons[0]; scopeUpgradeLevel=0; baitActive=false;
            gearOwned={flashlight:false,nightvision:false,petDog:false};
            campUpgrades={turret:0, spotter:0};
            entities=[]; updateHUD(); closeModals();
            notif(`PRESTIGE! Multiplier x${prestigeMultiplier}`);
            saveGame();
        }

        function handleInput(e) {
            if(!els.overlay.classList.contains('hidden')) return;
            const r = canvas.getBoundingClientRect();
            let cx = (e.touches?e.touches[0].clientX:e.clientX) - r.left;
            let cy = (e.touches?e.touches[0].clientY:e.clientY) - r.top;
            for(let i=entities.length-1; i>=0; i--) {
                const ent = entities[i];
                const dist = Math.sqrt(Math.pow(cx-ent.x,2)+Math.pow(cy-ent.y,2));
                if(dist < ent.radius+20) {
                    if(!ent.isBoss) {
                        if(ent.stats.type !== currentWeapon.type) {
                            particles.push(new TextParticle(ent.x, ent.y-20, "Wrong Gun!", "#fff", 0)); return;
                        }
                    }
                    let dmg = currentWeapon.damage;
                    let crit = scopeUpgradeLevel>0 && Math.random()<0.2;
                    if(crit) dmg*=2;
                    ent.hit(dmg, crit); return;
                }
            }
        }

        // UI Renders
        function renderShop() {
            const gw=document.getElementById('shopGridRifles'), gg=document.getElementById('shopGridGear'), gm=document.getElementById('shopGridMisc');
            gw.innerHTML=gg.innerHTML=gm.innerHTML="";
            const card=(item, el)=>{
                const div=document.createElement('div'); div.className='shop-item';
                if(item.style==='gold') div.style.border="2px solid gold";
                let btn="Buy", dis=false, cls="buy-btn";
                if(item.type==='rifle'||item.type==='small') {
                    if(item.id===currentWeapon.id) { btn="Equipped"; dis=true; cls+=" equipped"; }
                    else if(item.owned) { btn="Equip"; cls+=" owned"; }
                } else if(item.desc && !item.type) {
                    if(gearOwned[item.id]) { btn="Owned"; dis=true; cls+=" equipped"; }
                } else if(item.type==='upgrade' && scopeUpgradeLevel>=1) { btn="Maxed"; dis=true; cls+=" equipped"; }
                div.innerHTML=`<div><h3>${item.name}</h3><p>${item.desc||'Dmg: '+item.damage}</p></div><div><div class="item-price">$${item.price.toLocaleString()}</div><button class="${cls}" ${dis?'disabled':''}>${btn}</button></div>`;
                div.querySelector('button').onclick=()=>buyItem(item); el.appendChild(div);
            };
            weapons.forEach(w=>card(w,gw));
            gearItems.forEach(g=>card(g,gg));
            consumables.forEach(c=>card(c,gm));
        }

        function renderCamp() {
            const g = document.getElementById('campGrid'); g.innerHTML="";
            campItems.forEach(i => {
                const div=document.createElement('div'); div.className='shop-item';
                let lvl = campUpgrades[i.id] || 0;
                let isMax = lvl >= i.max;
                let btn = isMax ? "Max Lvl" : `Upgrade (${i.cost} Gems)`;
                div.innerHTML = `<div><h3>${i.name} (Lvl ${lvl})</h3><p>${i.desc}</p></div><div><button class="buy-btn ${isMax?'equipped':''}" ${isMax?'disabled':''}>${btn}</button></div>`;
                div.querySelector('button').onclick=()=>{
                    if(gems >= i.cost && !isMax) {
                        gems -= i.cost; campUpgrades[i.id]++; updateHUD(); renderCamp(); saveGame(true);
                    } else if (!isMax) notif("Need Gems");
                };
                g.appendChild(div);
            });
        }

        function buyItem(item) {
            // Check ownership first - This fixes the equip bug
            if((item.type==='rifle'||item.type==='small') && item.owned) {
                currentWeapon=item; updateHUD(); renderShop(); saveGame(true); notif("Equipped!"); return;
            }
            if(item.desc && !item.type && gearOwned[item.id]) return;
            if(item.type==='upgrade' && scopeUpgradeLevel>=1) return;

            // Then check cash
            if(cash<item.price) { notif("Not enough cash!"); return; }

            cash-=item.price;
            if(item.type==='rifle'||item.type==='small') { item.owned=true; currentWeapon=item; }
            else if(item.type==='consumable' && item.id==='bait') { baitActive=true; baitTimeLeft=60; els.baitBox.classList.remove('hidden'); }
            else if(item.type==='upgrade') scopeUpgradeLevel=1;
            else gearOwned[item.id]=true;
            notif("Purchased!"); updateHUD(); renderShop(); saveGame(true);
        }

        function renderTravel() {
            const g = document.getElementById('travelGrid'); g.innerHTML="";
            worlds.forEach(w=>{
                const div=document.createElement('div'); div.className='shop-item';
                let un=worldsUnlocked.includes(w.id), cur=currentWorldId===w.id;
                let btn=un?(cur?"Here":"Travel"):(w.locked?"Locked":`Unlock $${w.price.toLocaleString()}`);
                let cls=cur?"buy-btn equipped":(un?"buy-btn owned":(w.locked?"buy-btn disabled":"buy-btn"));
                let dis = cur || w.locked;
                div.innerHTML=`<h3>${w.name}</h3><div class="item-price">${un?'Unlocked':(w.locked?'Coming Soon':'$'+w.price.toLocaleString())}</div><button class="${cls}" ${dis?'disabled':''}>${btn}</button>`;
                div.querySelector('button').onclick=()=>{
                    if(dis) return;
                    if(un) { currentWorldId=w.id; updateWorldVisuals(); notif("Welcome!"); }
                    else {
                        if(cash>=w.price) { cash-=w.price; worldsUnlocked.push(w.id); currentWorldId=w.id; updateHUD(); updateWorldVisuals(); notif("Unlocked!"); saveGame(true); }
                        else notif("Need cash");
                    }
                    renderTravel();
                };
                g.appendChild(div);
            });
        }

        function renderPedia() {
            const g = document.getElementById('pediaGrid'); g.innerHTML="";
            for(let key in speciesConfig) {
                const s = speciesConfig[key];
                const stats = animalStats[key] || {};
                const total = Object.values(stats).reduce((a,b)=>a+b, 0);
                const div = document.createElement('div'); div.className='pedia-card';
                let html = `<div class="pedia-head"><span class="pedia-name">${s.name}</span><span class="pedia-total">Caught: ${total}</span></div><div class="rarity-row">`;
                rarities.forEach(r => {
                    const count = stats[r.name] || 0;
                    const unlocked = count > 0;
                    html += `<span class="rarity-badge ${unlocked?'unlocked':''}" style="background:${r.color}">${r.name} ${unlocked ? '('+count+')' : ''}</span>`;
                });
                html += `</div>`;
                div.innerHTML = html;
                g.appendChild(div);
            }
        }

        // --- 7. FIREBASE & LOOP ---

        async function initAuth() {
            try {
                if(typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
                console.log("Auth OK");
            } catch(e) { 
                console.error(e);
                // Fallback for mismatch errors
                try { await signInAnonymously(auth); } catch(e2) {}
            }
        }

        async function saveGame(silent) {
            if(!userId) { if(!silent) notif("Not Signed In"); return; }
            if(!canSave) { if(!silent) notif("Still Loading..."); return; }
            
            const data = { 
                cash, gems, prestigeLevel, killCount, hasKilledMythic, scopeUpgradeLevel, gearOwned, campUpgrades, worldsUnlocked, currentWorldId, 
                currentWeaponId:currentWeapon.id, 
                weaponsOwned:weapons.filter(w=>w.owned).map(w=>w.id), 
                achievementsAchieved:achievements.filter(a=>a.achieved).map(a=>a.id), 
                animalStats, 
                lastSave: Date.now() 
            };
            try { await setDoc(doc(db, 'artifacts', appId, 'users', userId, 'data', 'save1'), data); if(!silent) notif("Game Saved"); } catch(e){
                // Check specific errors
                console.error("Save Error:", e);
                if(e.code === 'permission-denied') notif("Error: Permission Denied");
                else if(e.message && e.message.includes("offline")) notif("Error: Offline");
                else notif("Save Failed");
            }
        }

        async function loadGame(retries=5) {
            if(!userId) return;
            try {
                const s = await getDoc(doc(db, 'artifacts', appId, 'users', userId, 'data', 'save1'));
                if(s.exists()) {
                    const d=s.data();
                    cash=d.cash||0; gems=d.gems||0; prestigeLevel=d.prestigeLevel||0; killCount=d.killCount||0; hasKilledMythic=d.hasKilledMythic||false;
                    scopeUpgradeLevel=d.scopeUpgradeLevel||0; gearOwned=d.gearOwned||{flashlight:false,nightvision:false,petDog:false};
                    campUpgrades=d.campUpgrades||{turret:0,spotter:0};
                    worldsUnlocked=d.worldsUnlocked||['forest']; currentWorldId=d.currentWorldId||'forest';
                    animalStats=d.animalStats||{};
                    if(d.weaponsOwned) weapons.forEach(w=>{if(d.weaponsOwned.includes(w.id))w.owned=true;});
                    if(d.currentWeaponId) { const fw=weapons.find(w=>w.id===d.currentWeaponId); if(fw&&fw.owned) currentWeapon=fw; }
                    if(d.achievementsAchieved) achievements.forEach(a=>{if(d.achievementsAchieved.includes(a.id))a.achieved=true;});
                    prestigeMultiplier=1+(prestigeLevel*0.5); updateHUD(); updateWorldVisuals(); notif("Progress Loaded!");
                }
                canSave=true;
                updateHUD();
            } catch(e) { if(retries>0) setTimeout(()=>loadGame(retries-1),2000); else notif("Cloud Error"); }
        }

        function resize() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            const w = worlds.find(x=>x.id===currentWorldId)||worlds[0];
            trees=[]; let num=window.innerWidth/50;
            for(let i=0;i<num;i++) trees.push({x:Math.random()*canvas.width, y:canvas.height-100-Math.random()*50, h:100+Math.random()*100, w:40+Math.random()*40, c:w.treeColor});
            mountains=[{h:200,c:"#546E7A",o:0},{h:100,c:"#78909C",o:150}];
        }

        function loop(ts) {
            let dt=ts-lastTime; lastTime=ts;
            let time = Date.now() + (window.timeOffset || 0);
            dayCycle=(time/60000)%1; isNight=dayCycle>0.5;
            let hrs=Math.floor(dayCycle*24), mins=Math.floor((dayCycle*24*60)%60), ampm=hrs>=12?"PM":"AM", dH=hrs%12||12;
            els.timeDisplay.textContent=`${dH}:${mins.toString().padStart(2,'0')} ${ampm}`;

            if (!bossActive) {
                bossSpawnTimer -= dt/1000;
                if(bossSpawnTimer <= 0) spawnBoss();
                let bM = Math.floor(Math.max(0,bossSpawnTimer)/60);
                let bS = Math.floor(Math.max(0,bossSpawnTimer)%60);
                els.bossTimer.textContent = `${bM}:${bS.toString().padStart(2,'0')}`;
            } else {
                els.bossTimer.textContent = "ACTIVE!";
                if(bossEntity) {
                    let pct = Math.max(0, bossEntity.currentHp / bossEntity.maxHp);
                    els.bossHealthBar.style.width = (pct*100) + "%";
                    if(bossEntity.marked && bossEntity.currentHp > 0) {
                        bossActive = false; bossSpawnTimer = 300; els.bossHealthContainer.style.display='none';
                        notif("The Alpha Escaped!");
                    }
                }
            }

            ctx.clearRect(0,0,canvas.width,canvas.height);
            const w = worlds.find(x=>x.id===currentWorldId)||worlds[0];
            
            let g=ctx.createLinearGradient(0,0,0,canvas.height);
            g.addColorStop(0,isNight?"#0D1B2A":w.bgColors[0]); g.addColorStop(1,isNight?"#1B2631":w.bgColors[1]);
            ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);

            mountains.forEach(m=>{
                ctx.fillStyle=isNight?"#263238":m.c; ctx.beginPath(); ctx.moveTo(0,canvas.height);
                for(let x=0;x<=canvas.width;x+=50) ctx.lineTo(x,canvas.height-m.h-Math.sin(x*0.01+m.o)*50);
                ctx.lineTo(canvas.width,canvas.height); ctx.fill();
            });

            ctx.fillStyle=isNight?"#1B5E20":w.groundColor; if(w.id==='tundra'&&isNight) ctx.fillStyle="#90A4AE";
            ctx.fillRect(0,canvas.height-150,canvas.width,150);

            trees.forEach(t=>{
                ctx.fillStyle=isNight?"#1B1B1B":"#3E2723"; ctx.fillRect(t.x,t.y-t.h*0.2,t.w/4,t.h*0.2);
                ctx.fillStyle=isNight?"#003300":t.c; if(w.id==='tundra'&&isNight) ctx.fillStyle="#455A64";
                ctx.beginPath(); ctx.moveTo(t.x-t.w/2,t.y-t.h*0.2); ctx.lineTo(t.x+t.w/8,t.y-t.h); ctx.lineTo(t.x+t.w/1.5,t.y-t.h*0.2); ctx.fill();
            });

            entities.sort((a,b)=>a.y-b.y);
            entities.forEach((e,i)=>{ 
                e.update(); e.draw(); 
                if(e.marked) {
                    if(e.isBoss) {
                        bossEntity = null;
                        bossActive = false; 
                        els.bossHealthContainer.style.display = 'none';
                        bossSpawnTimer = 300;
                    }
                    entities.splice(i,1); 
                }
            });
            particles.forEach((p,i)=>{ p.update(); p.draw(); if(p.life<=0) particles.splice(i,1); });

            if(gearOwned.petDog) {
                let dogX = 100; let dogY = canvas.height - 80;
                ctx.save(); ctx.translate(dogX, dogY);
                ctx.fillStyle = "#D7CCC8"; ctx.fillRect(0,0,30,20); 
                ctx.fillRect(25,-15,15,15); 
                ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(35,-10,2,0,Math.PI*2); ctx.fill(); 
                ctx.fillStyle = "#5D4037"; ctx.beginPath(); ctx.moveTo(25,-15); ctx.lineTo(20,0); ctx.lineTo(30,-5); ctx.fill(); 
                ctx.fillRect(0,20,5,10); ctx.fillRect(25,20,5,10); 
                let wag = Math.sin(Date.now()*0.01)*5;
                ctx.lineWidth=3; ctx.strokeStyle="#D7CCC8"; ctx.beginPath(); ctx.moveTo(0,5); ctx.lineTo(-10, -5+wag); ctx.stroke();
                ctx.restore();
            }

            if(isNight) {
                if(!gearOwned.nightvision) {
                    ctx.globalCompositeOperation='source-over'; ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.fillRect(0,0,canvas.width,canvas.height);
                } else {
                    ctx.fillStyle="rgba(0,255,0,0.1)"; ctx.fillRect(0,0,canvas.width,canvas.height);
                    ctx.fillStyle="rgba(0,0,0,0.2)"; for(let i=0;i<canvas.height;i+=4) ctx.fillRect(0,i,canvas.width,2);
                }
            }
            if(isNight && gearOwned.flashlight && !gearOwned.nightvision && window.mousePos) {
                ctx.save(); ctx.globalCompositeOperation="destination-out";
                let g=ctx.createRadialGradient(window.mousePos.x, window.mousePos.y, 50, window.mousePos.x, window.mousePos.y, 200);
                g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(1,"rgba(0,0,0,0)");
                ctx.fillStyle=g; ctx.beginPath(); ctx.arc(window.mousePos.x, window.mousePos.y, 150, 0, Math.PI*2); ctx.fill();
                ctx.globalCompositeOperation="source-over"; ctx.fillStyle="rgba(255,255,200,0.1)";
                ctx.beginPath(); ctx.arc(window.mousePos.x, window.mousePos.y, 150, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }

            spawnTimer+=dt; 
            let interval = spawnInterval * (1 - (campUpgrades.spotter * 0.1));
            if(spawnTimer>interval) { spawnEntity(); spawnTimer=0; }
            
            if(campUpgrades.turret > 0) {
                turretTimer += dt;
                let tInt = (5 - campUpgrades.turret * 0.4) * 1000;
                if(turretTimer > tInt) {
                    turretTimer = 0;
                    let target = entities.find(e => !e.isBoss && e.x > 0 && e.x < canvas.width);
                    if(target) {
                        target.hit(100, false);
                        createExplosion(target.x, target.y, "#FFEB3B", false);
                    }
                }
            }

            if(baitActive) {
                baitTimeLeft-=dt/1000; els.baitTimer.innerText=Math.ceil(baitTimeLeft);
                if(baitTimeLeft<=0) { baitActive=false; els.baitBox.classList.add('hidden'); notif("Bait Expired"); }
            }
            requestAnimationFrame(loop);
        }

        window.mousePos = {x:0,y:0};
        window.addEventListener('mousemove', e=>{ const r=canvas.getBoundingClientRect(); window.mousePos={x:e.clientX-r.left, y:e.clientY-r.top}; });
        window.addEventListener('keydown', e => {
            if(e.key === '-') { els.overlay.classList.remove('hidden'); els.adminModal.classList.remove('hidden'); }
        });

        els.adminLoginBtn.onclick = () => {
            if(els.adminPass.value === "BabyJayce123") {
                els.adminLoginDiv.style.display = 'none'; els.adminControls.style.display = 'flex'; notif("Access Granted");
            } else notif("Access Denied");
        };

        window.addEventListener('resize', resize);
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput);

        const closeModals=()=>{ els.overlay.classList.add('hidden'); document.querySelectorAll('.modal').forEach(m=>m.classList.add('hidden')); };
        els.overlay.onclick=closeModals; document.querySelectorAll('.close-modal').forEach(b=>b.onclick=closeModals);
        document.getElementById('shopBtn').onclick=()=>{ renderShop(); els.overlay.classList.remove('hidden'); els.shopModal.classList.remove('hidden'); };
        document.getElementById('campBtn').onclick=()=>{ renderCamp(); els.overlay.classList.remove('hidden'); els.campModal.classList.remove('hidden'); };
        document.getElementById('travelBtn').onclick=()=>{ renderTravel(); els.overlay.classList.remove('hidden'); els.travelModal.classList.remove('hidden'); };
        document.getElementById('pediaBtn').onclick=()=>{ renderPedia(); els.overlay.classList.remove('hidden'); els.pediaModal.classList.remove('hidden'); };
        document.getElementById('achieveBtn').onclick=()=>{ 
            const l=document.getElementById('achieveList'); l.innerHTML="";
            achievements.forEach(a=>{
                const d=document.createElement('div'); d.className=`achieve-item ${a.achieved?'unlocked':''}`;
                d.innerHTML=`<div><div class="achieve-title">${a.title}</div><div class="achieve-desc">${a.desc}</div></div><div class="achieve-status">${a.achieved?'<i class="fas fa-check-circle"></i>':'<i class="fas fa-lock"></i>'}</div>`;
                l.appendChild(d);
            });
            els.overlay.classList.remove('hidden'); els.achieveModal.classList.remove('hidden'); 
        };
        els.prestigeBtn.onclick=()=>{ els.overlay.classList.remove('hidden'); els.prestigeModal.classList.remove('hidden'); };
        document.getElementById('confirmPrestige').onclick=doPrestige;
        els.saveBtn.onclick=()=>saveGame();

        onAuthStateChanged(auth, (user)=>{
            if(user) {
                userId=user.uid;
                if(!initialLoadDone) { initialLoadDone=true; loadGame(5); }
                setInterval(()=>saveGame(true),30000);
            }
        });

        initAuth();
        resize();
        requestAnimationFrame(loop);

    </script>
</body>
</html>
