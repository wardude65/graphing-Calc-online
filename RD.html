<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Diamond</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh; 
            width: 100vw;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            overscroll-behavior: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
        canvas {
            display: block;
            image-rendering: pixelated; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            width: 100%;
            height: auto;
            aspect-ratio: 4/3;
        }
        @media (min-aspect-ratio: 4/3) {
            canvas {
                width: auto;
                height: 100%;
            }
        }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 11;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2vmin;
            box-sizing: border-box;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.8);
            padding: 1vmin;
            border: 2px solid #fff;
            font-size: 1.5vmin;
        }
        .message-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #e63946;
            color: white;
            padding: 4vmin;
            border: 0.5vmin solid white;
            text-align: center;
            display: none;
            z-index: 30;
            box-shadow: 1vmin 1vmin 0px rgba(0,0,0,0.5);
            min-width: 40vmin;
        }
        .message-box h2 { font-size: 3vmin; margin-bottom: 2vmin; }
        .message-box p { font-size: 1.5vmin; line-height: 2.5vmin; margin-bottom: 3vmin; }
        .message-box button {
            background: white; border: none;
            font-family: 'Press Start 2P', cursive;
            padding: 1.5vmin 3vmin;
            font-size: 1.5vmin;
            cursor: pointer;
            color: #e63946;
        }
        .message-box button:hover { background: #f1faee; }
        
        .upgrade-shop {
            display: flex; flex-direction: column; gap: 10px; text-align: left; margin-bottom: 20px;
        }
        .upgrade-row {
            display: flex; justify-content: space-between; align-items: center; font-size: 1.2vmin;
        }
        .upgrade-btn {
            padding: 5px 10px; font-size: 10px; background: #1d3557; color: white; border: 1px solid white; cursor: pointer;
        }
        
        #controls-hint {
            text-align: center; font-size: 1.2vmin; opacity: 0.8; text-shadow: 1px 1px 0 #000;
        }
        #pitch-meter-container {
            position: absolute;
            bottom: 20%; left: 50%;
            transform: translateX(-50%);
            width: 200px; height: 20px;
            background: #333;
            border: 2px solid white;
            display: none;
            pointer-events: none;
        }
        #pitch-meter-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, yellow, green, yellow);
        }
        #pitch-meter-marker {
            position: absolute; top: -5px; bottom: -5px; width: 4px; background: white; left: 0%;
        }
        #xp-display {
            position: absolute; top: 10px; right: 10px;
            color: gold; font-size: 1.5vmin; text-shadow: 1px 1px 0 #000;
        }
        #commentary-box {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 4px;
            font-size: 1.2vmin; color: #f1faee; text-align: center;
            opacity: 0; transition: opacity 0.3s;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    
    <div id="ui-layer">
        <div class="scoreboard">
            <div>AWAY <span id="score-away" style="color:#e63946">0</span></div>
            <div id="inning-display">INN 1 ▲</div>
            <div>HOME <span id="score-home" style="color:#457b9d">0</span></div>
        </div>
        <div id="xp-display">XP: 0</div>
        
        <div id="commentary-box">PLAY BALL!</div>

        <div id="pitch-meter-container">
            <div id="pitch-meter-fill"></div>
            <div id="pitch-meter-marker"></div>
        </div>

        <div style="text-align: right; margin-top: 5px; font-size: 1.2vmin; text-shadow: 1px 1px 0 #000;">
            <div id="outs-display">OUTS: ○ ○ ○</div>
            <div id="count-display">B:0 S:0</div>
            <div id="bases-display">◆ ◇ ◇</div>
        </div>
        <div id="controls-hint">WAITING...</div>
    </div>

    <div id="message-modal" class="message-box">
        <h2 id="msg-title">RETRO DIAMOND</h2>
        <div id="msg-content"></div>
        <button id="msg-btn">PLAY BALL</button>
    </div>
</div>

<script>
/**
 * RETRO DIAMOND - v2.3
 * Fixed: Outs not resetting when switching sides (causing 1-hit innings).
 * Fixed: Infinite Grass (prevents black screen).
 * Fixed: Gameplay flow safety nets.
 */

const AudioEngine = {
    ctx: null,
    init: function() {
        if (this.ctx) return;
        try {
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        } catch(e) { console.error("Audio init failed", e); }
    },
    playTone: function(freq, type, duration, vol = 0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    playNoise: function(duration, vol = 0.1) {
        if (!this.ctx) return;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        noise.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
    },
    sfx: {
        hit: () => AudioEngine.playNoise(0.1, 0.3),
        whack: () => AudioEngine.playTone(200, 'square', 0.1, 0.2),
        cheer: () => { for(let i=0; i<5; i++) setTimeout(() => AudioEngine.playNoise(0.5, 0.05), i*100); },
        pitch: () => AudioEngine.playTone(600, 'triangle', 0.1, 0.05),
        strike: () => AudioEngine.playTone(150, 'sawtooth', 0.2, 0.1),
        select: () => AudioEngine.playTone(440, 'square', 0.1, 0.1),
        upgrade: () => { AudioEngine.playTone(880, 'square', 0.1, 0.1); setTimeout(()=>AudioEngine.playTone(1100, 'square', 0.2, 0.1), 100); }
    }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const GAME_WIDTH = 320;
const GAME_HEIGHT = 240;

const STATE = {
    MENU: 0,
    PITCHING_WINDUP: 10,
    PITCHING_THROW: 11,
    BATTING_WAIT: 20,
    BATTING_SWING: 21,
    IN_PLAY: 30,
    RESULT: 40,
    SHOP: 50,
    GAMEOVER: 60
};

let currentState = STATE.MENU;
let frameCount = 0;
let crowdJump = 0;

let teamStats = {
    power: 1,
    contact: 1,
    pitching: 1,
    xp: 0,
    altUniform: false
};

const UPGRADE_COSTS = [100, 250, 500, 1000, 9999];

let gameData = {
    scoreHome: 0,
    scoreAway: 0,
    inning: 1,
    isTop: true,
    outs: 0,
    balls: 0,
    strikes: 0,
    bases: [false, false, false],
    weather: 'clear'
};

let ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, state: 'idle' };
let batter = { x: 100, y: 140, swingTimer: 0 };
let input = { x: 0, y: 0, clicked: false };
let camera = { x: 0, y: 0, targetX: 0, targetY: 0, zoom: 1, shake: 0 };
let particles = [];
let weatherParticles = [];
let pitchMeter = { active: false, value: 0, dir: 1, speed: 2, quality: 0 };

// --- Logic ---

function resetGame() {
    gameData.scoreHome = 0;
    gameData.scoreAway = 0;
    gameData.inning = 1;
    gameData.isTop = true;
    gameData.outs = 0;
    gameData.bases = [false, false, false];
    teamStats.xp = 0;
    startInning();
}

function startInning() {
    gameData.outs = 0;
    gameData.bases = [false, false, false];
    resetCount();
    if (Math.random() < 0.2) gameData.weather = (Math.random() > 0.5) ? 'rain' : 'clear';
    setupPhase();
}

function resetCount() {
    gameData.balls = 0;
    gameData.strikes = 0;
    updateUI();
}

function setupPhase() {
    ball.state = 'held';
    ball.z = 10;
    batter.swingTimer = 0;
    setCommentary(""); 
    
    // Reset camera to home plate
    camera.targetX = 0;
    camera.targetY = 0;
    camera.x = 0;
    camera.y = 0;
    
    if (gameData.isTop) {
        currentState = STATE.PITCHING_WINDUP;
        ball.x = 160; ball.y = 80;
        pitchMeter.active = true;
        pitchMeter.value = 0;
        document.getElementById('controls-hint').innerText = "TAP TO START METER -> TAP GREEN TO THROW";
        document.getElementById('pitch-meter-container').style.display = 'block';
        setCommentary("You're on the mound.");
    } else {
        currentState = STATE.BATTING_WAIT;
        ball.x = 160; ball.y = 80;
        document.getElementById('controls-hint').innerText = "MOUSE/TOUCH: AIM | TAP: SWING";
        document.getElementById('pitch-meter-container').style.display = 'none';
        setCommentary("Batter up! Find your pitch.");
        setTimeout(cpuPitch, 1500);
    }
    updateUI();
}

function switchSides() {
    if (gameData.isTop) {
        // Switch from Top (Pitching) to Bottom (Batting)
        gameData.isTop = false; 
        
        // CRITICAL FIX: Reset outs and bases for the new half-inning
        gameData.outs = 0;
        gameData.bases = [false, false, false];
        resetCount();
        
        showMessage("BOTTOM " + gameData.inning, "You are Batting.", "GO!", setupPhase);
    } else {
        // End of full inning
        if (gameData.inning >= 9 && gameData.scoreHome !== gameData.scoreAway) {
            endGame();
            return;
        }
        gameData.inning++;
        gameData.isTop = true;
        showShop();
    }
}

// --- Actions ---

function handlePitchClick() {
    if (!pitchMeter.active) {
        pitchMeter.active = true;
        pitchMeter.dir = 1;
        pitchMeter.value = 0;
        return;
    }
    pitchMeter.active = false;
    let val = pitchMeter.value;
    let accuracy = 0.1;
    if (val > 80 && val < 95) accuracy = 1.0;
    else if (val > 60) accuracy = 0.5;
    
    pitchMeter.quality = accuracy;
    throwBallPlayer(accuracy);
    document.getElementById('pitch-meter-container').style.display = 'none';
}

function throwBallPlayer(accuracy) {
    currentState = STATE.PITCHING_THROW;
    ball.state = 'pitching';
    AudioEngine.sfx.pitch();
    setCommentary("Here comes the pitch...");
    
    let speed = 2 + (teamStats.pitching * 0.2);
    if (accuracy < 0.5) speed *= 0.8;
    ball.vx = (Math.random() - 0.5) * (1 - accuracy) * 2;
    ball.vy = speed * 2.5;
    ball.vz = -0.15;
    
    setTimeout(() => {
        let cpuSkill = 0.3 + (gameData.inning * 0.05);
        let hitChance = cpuSkill + (1 - accuracy) * 0.5;
        
        if (Math.random() < hitChance) {
            let quality = Math.random() * 20;
            hitBall(quality, true);
        } else {
            handleStrike();
        }
    }, 600);
}

function cpuPitch() {
    if (currentState !== STATE.BATTING_WAIT) return;
    ball.state = 'pitching';
    AudioEngine.sfx.pitch();
    ball.x = 160; ball.y = 80; ball.z = 10;
    
    let targetX = 140 + Math.random() * 40;
    let targetY = 220;
    let frames = 60 - (gameData.inning * 2);
    if (frames < 10) frames = 10; // Safety floor
    ball.vx = (targetX - ball.x) / frames;
    ball.vy = (targetY - ball.y) / frames;
    ball.vz = (0 - ball.z) / frames;
}

function checkPlayerSwing() {
    if (ball.state !== 'pitching') return;
    if (ball.y > 190 && ball.y < 230) {
        let aimError = Math.abs(ball.x - input.x);
        let contactZone = 25 * (1 + teamStats.contact * 0.1);
        if (aimError < contactZone) hitBall(aimError, false);
        else {
            AudioEngine.sfx.strike();
            createFloatingText("WHIFF", batter.x, 200);
            handleStrike();
        }
    } else {
        AudioEngine.sfx.strike();
        handleStrike();
    }
}

function hitBall(error, isCPU) {
    currentState = STATE.IN_PLAY;
    ball.state = 'hit';
    AudioEngine.sfx.whack();
    camera.shake = 15;
    setCommentary("IT'S A HIT!");
    
    let powerStat = isCPU ? (1 + gameData.inning*0.1) : teamStats.power;
    let power = (1 - (error / 30)) * (1 + powerStat * 0.2); 
    ball.vz = 2 + (power * 4);
    ball.vy = isCPU ? -3 - (power * 4) : -3 - (power * 5);
    ball.vx = (Math.random() - 0.5) * 4;
    
    for(let i=0; i<10; i++) particles.push({ x: ball.x, y: ball.y, z: ball.z, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, vz: Math.random()*5, life: 30, color: 'white' });
    
    // Safety timeout: Ensure game continues even if visual glitches happen
    setTimeout(() => {
        if (ball.state === 'hit') resolveHit(power, ball.vx);
    }, 1200);
}

function resolveHit(power, angle) {
    let distance = power * 400;
    let outcome = 'OUT';
    
    if (distance < 150) outcome = 'OUT';
    else if (distance < 280) outcome = Math.random() > 0.4 ? 'SINGLE' : 'OUT';
    else if (distance < 340) outcome = Math.random() > 0.6 ? 'DOUBLE' : 'OUT';
    else if (distance < 400) outcome = Math.random() > 0.8 ? 'TRIPLE' : 'OUT';
    else outcome = 'HOME RUN';
    
    if (Math.abs(angle) > 2) outcome = 'FOUL';
    
    createFloatingText(outcome, 160, 100);
    
    if (outcome === 'FOUL') {
        AudioEngine.sfx.strike();
        setCommentary("Foul Ball.");
        handleStrike(true);
    } else if (outcome === 'OUT') {
        AudioEngine.sfx.strike();
        gameData.outs++;
        setCommentary("You're Out!");
        finishPlay();
    } else {
        AudioEngine.sfx.cheer();
        triggerCrowdJump(); // Idea: Crowd reacts
        setCommentary(outcome + "!");
        if (!gameData.isTop) {
            teamStats.xp += 50;
            if (outcome === 'HOME RUN') teamStats.xp += 100;
        }
        advanceRunners(outcome);
    }
}

function handleStrike(foul=false) {
    if (foul && gameData.strikes >= 2) {
        setupPhase();
        return;
    }
    gameData.strikes++;
    setCommentary("STRIKE " + gameData.strikes);
    if (gameData.strikes >= 3) {
        createFloatingText("STRIKEOUT!", 160, 100);
        gameData.outs++;
        if (gameData.isTop) teamStats.xp += 25;
        finishPlay();
    } else {
        setupPhase();
    }
}

function finishPlay() {
    resetCount();
    // Safety check for NaN camera
    if (isNaN(camera.x) || isNaN(camera.y)) { camera.x=0; camera.y=0; }
    
    if (gameData.outs >= 3) setTimeout(switchSides, 2000);
    else setTimeout(setupPhase, 1500); // Faster restart
}

function advanceRunners(hitType) {
    let runs = 0;
    let bases = gameData.bases;
    let newBases = [false, false, false];
    
    if (hitType === 'HOME RUN') {
        runs = 1 + (bases[0]?1:0) + (bases[1]?1:0) + (bases[2]?1:0);
        newBases = [false, false, false];
        createExplosion(160, 50, gameData.weather === 'rain' ? 'cyan' : 'gold');
    } else if (hitType === 'TRIPLE') {
        runs = (bases[0]?1:0) + (bases[1]?1:0) + (bases[2]?1:0);
        newBases = [false, false, true];
    } else if (hitType === 'DOUBLE') {
        runs = (bases[1]?1:0) + (bases[2]?1:0);
        newBases = [false, true, bases[0]];
    } else if (hitType === 'SINGLE') {
        runs = (bases[2]?1:0);
        newBases = [true, bases[0], bases[1]];
    }
    
    gameData.bases = newBases;
    if (gameData.isTop) gameData.scoreAway += runs;
    else gameData.scoreHome += runs;
    updateUI();
    finishPlay();
}

// --- UI & Shop ---

function setCommentary(text) {
    const box = document.getElementById('commentary-box');
    box.innerText = text;
    box.style.opacity = text ? 1 : 0;
}

function showMessage(title, text, btnText, action) {
    const modal = document.getElementById('message-modal');
    document.getElementById('msg-title').innerText = title;
    document.getElementById('msg-content').innerHTML = `<p>${text}</p>`;
    const btn = document.getElementById('msg-btn');
    btn.innerText = btnText;
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.addEventListener('click', () => {
        AudioEngine.sfx.select();
        modal.style.display = 'none';
        if (action) action();
    });
    modal.style.display = 'block';
}

function showShop() {
    currentState = STATE.SHOP;
    const modal = document.getElementById('message-modal');
    document.getElementById('msg-title').innerText = "LOCKER ROOM";
    
    const pCost = UPGRADE_COSTS[teamStats.power] || "MAX";
    const cCost = UPGRADE_COSTS[teamStats.contact] || "MAX";
    const piCost = UPGRADE_COSTS[teamStats.pitching] || "MAX";
    const uniformText = teamStats.altUniform ? "AWAY (RED)" : "HOME (BLUE)";
    
    let html = `
        <div class="upgrade-shop">
            <div class="upgrade-row"><span>PWR (Lv ${teamStats.power})</span><button class="upgrade-btn" onclick="buyUpgrade('power', ${pCost})">${pCost} XP</button></div>
            <div class="upgrade-row"><span>EYE (Lv ${teamStats.contact})</span><button class="upgrade-btn" onclick="buyUpgrade('contact', ${cCost})">${cCost} XP</button></div>
            <div class="upgrade-row"><span>ARM (Lv ${teamStats.pitching})</span><button class="upgrade-btn" onclick="buyUpgrade('pitching', ${piCost})">${piCost} XP</button></div>
            <div class="upgrade-row"><span>UNIFORM</span><button class="upgrade-btn" onclick="toggleUniform()">${uniformText}</button></div>
        </div>
        <p>Current XP: ${teamStats.xp}</p>
    `;
    
    document.getElementById('msg-content').innerHTML = html;
    const btn = document.getElementById('msg-btn');
    btn.innerText = "NEXT INNING";
    const newBtn = btn.cloneNode(true);
    btn.parentNode.replaceChild(newBtn, btn);
    newBtn.addEventListener('click', () => {
        modal.style.display = 'none';
        AudioEngine.sfx.select();
        startInning();
    });
    modal.style.display = 'block';
}

window.buyUpgrade = function(stat, cost) {
    if (teamStats.xp >= cost && cost !== "MAX") {
        teamStats.xp -= cost;
        teamStats[stat]++;
        AudioEngine.sfx.upgrade();
        showShop();
    } else AudioEngine.playTone(100, 'sawtooth', 0.2);
};

window.toggleUniform = function() {
    teamStats.altUniform = !teamStats.altUniform;
    AudioEngine.sfx.select();
    showShop();
}

function endGame() {
    currentState = STATE.GAMEOVER;
    let win = gameData.scoreHome > gameData.scoreAway;
    showMessage(win ? "VICTORY!" : "DEFEAT", 
        `Final: ${gameData.scoreHome} - ${gameData.scoreAway}<br>XP Earned: ${teamStats.xp}`, 
        "NEW GAME", resetGame);
}

function updateUI() {
    document.getElementById('score-home').innerText = gameData.scoreHome;
    document.getElementById('score-away').innerText = gameData.scoreAway;
    document.getElementById('inning-display').innerText = `INN ${gameData.inning} ${gameData.isTop ? '▲' : '▼'}`;
    document.getElementById('xp-display').innerText = `XP: ${teamStats.xp}`;
    let outsStr = ''; for(let i=0; i<3; i++) outsStr += (i < gameData.outs ? '● ' : '○ ');
    document.getElementById('outs-display').innerText = `OUTS: ${outsStr}`;
    document.getElementById('count-display').innerText = `B:${gameData.balls} S:${gameData.strikes}`;
    let b1 = gameData.bases[0] ? '◆' : '◇'; let b2 = gameData.bases[1] ? '◆' : '◇'; let b3 = gameData.bases[2] ? '◆' : '◇';
    document.getElementById('bases-display').innerText = `3:${b3} 2:${b2} 1:${b1}`;
}

// --- Visual Effects ---
function createExplosion(x, y, color) {
    for(let i=0; i<30; i++) particles.push({ x: x, y: y, z: 20, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, vz: Math.random()*10, life: 60, color: color });
}
function createFloatingText(text, x, y) {
    particles.push({ text: text, x: x, y: y, z: 20, life: 60, type: 'text' });
}
function triggerCrowdJump() {
    crowdJump = 10;
}

function updateParticles() {
    if (crowdJump > 0) crowdJump--;
    if (gameData.weather === 'rain') {
        for(let i=0; i<5; i++) weatherParticles.push({ x: Math.random() * GAME_WIDTH, y: -10, z: 10, vy: 10 + Math.random()*5, life: 30 });
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.life--;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        if (p.type === 'text') p.y -= 0.5;
        else {
            p.x += p.vx; p.y += p.vy; p.z += p.vz;
            p.vz -= 0.5;
            if (p.z < 0) { p.z = 0; p.vx *= 0.8; p.vy *= 0.8; }
        }
    }
    for(let i = weatherParticles.length - 1; i >= 0; i--) {
        let p = weatherParticles[i]; p.y += p.vy; p.x -= 1;
        if (p.y > GAME_HEIGHT) weatherParticles.splice(i, 1);
    }
}

// --- Drawing ---
function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0); 
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.scale(2, 2);

    // Camera Calculation
    if (ball.state === 'hit') {
        let desiredY = ball.y - 120;
        if (desiredY > 0) desiredY = 0; 
        
        // Safety: Prevent camera from going too far
        if (desiredY < -2000) desiredY = -2000;
        
        camera.x += (0 - camera.x) * 0.1;
        camera.y += (desiredY - camera.y) * 0.1;
    } else {
        camera.x += (0 - camera.x) * 0.1;
        camera.y += (0 - camera.y) * 0.1;
    }
    
    // Safety check for NaN
    if (isNaN(camera.x)) camera.x = 0;
    if (isNaN(camera.y)) camera.y = 0;

    let sx = (Math.random() - 0.5) * camera.shake;
    let sy = (Math.random() - 0.5) * camera.shake;
    camera.shake *= 0.9;
    
    ctx.save();
    ctx.translate(sx - camera.x, sy - camera.y);
    
    // INFINITE GRASS: Draw huge rect around camera to prevent black void
    ctx.fillStyle = gameData.weather === 'rain' ? '#3d6022' : '#4d8032';
    // Center big rect on camera position
    ctx.fillRect(camera.x - 1000, camera.y - 1000, 2000 + GAME_WIDTH, 2000 + GAME_HEIGHT);
    
    // Dirt
    ctx.fillStyle = '#c78d55';
    ctx.beginPath();
    ctx.moveTo(160, 220); ctx.lineTo(260, 130); ctx.lineTo(160, 60); ctx.lineTo(60, 130);
    ctx.closePath(); ctx.fill();
    
    // Infield Grass overlay
    ctx.fillStyle = gameData.weather === 'rain' ? '#3d6022' : '#4d8032';
    ctx.beginPath();
    ctx.moveTo(160, 200); ctx.lineTo(240, 130); ctx.lineTo(160, 80); ctx.lineTo(80, 130);
    ctx.closePath(); ctx.fill();
    
    // Bases
    ctx.fillStyle = 'white';
    ctx.fillRect(255, 125, 10, 10); ctx.fillRect(155, 55, 10, 10); ctx.fillRect(55, 125, 10, 10);
    ctx.beginPath(); ctx.moveTo(155, 220); ctx.lineTo(165, 220); ctx.lineTo(165, 225); ctx.lineTo(160, 230); ctx.lineTo(155, 225); ctx.fill();
    
    // Foul lines
    ctx.strokeStyle = 'white'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(160, 220); ctx.lineTo(600, -400); ctx.moveTo(160, 220); ctx.lineTo(-280, -400); ctx.stroke();
    
    // Crowd
    ctx.fillStyle = '#333';
    ctx.fillRect(-500, -440, GAME_WIDTH+1000, 420); 
    for(let i=-500; i<820; i+=6) {
        for(let j=-420; j<-20; j+=6) {
            ctx.fillStyle = (i%12===0) ? '#e63946' : '#fff';
            let jumpY = (crowdJump > 0 && Math.random()>0.5) ? -2 : 0;
            ctx.fillRect(i, j + jumpY, 4, 4);
        }
    }
    
    // Players
    let p1Color = teamStats.altUniform ? '#457b9d' : '#e63946'; // Away
    let p2Color = teamStats.altUniform ? '#e63946' : '#457b9d'; // Home (Player default)
    
    drawPlayer(160, 80, gameData.isTop ? p2Color : p1Color); // Pitcher
    let batterColor = gameData.isTop ? p1Color : p2Color;
    drawPlayer(batter.x, 220, batterColor, 1.2, true);
    
    if (gameData.bases[0]) drawPlayer(260, 130, batterColor, 0.8);
    if (gameData.bases[1]) drawPlayer(160, 60, batterColor, 0.7);
    if (gameData.bases[2]) drawPlayer(60, 130, batterColor, 0.8);
    
    if (ball.state !== 'idle') drawBall();
    
    if (!gameData.isTop && currentState <= STATE.BATTING_WAIT) {
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.arc(input.x, 210, 10 + (teamStats.contact*2), 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'yellow'; ctx.fillRect(input.x-2, 208, 4, 4);
    }
    
    particles.forEach(p => {
        if (p.type === 'text') {
            ctx.fillStyle = 'white'; ctx.font = '16px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y - p.z, 3, 3);
        }
    });
    
    ctx.strokeStyle = 'rgba(150, 200, 255, 0.5)'; ctx.lineWidth = 1; ctx.beginPath();
    weatherParticles.forEach(p => { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 2, p.y + 5); });
    ctx.stroke();

    ctx.restore();
}

function drawPlayer(x, y, color, scale = 1, isBatter = false) {
    const w = 12 * scale, h = 20 * scale;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath(); ctx.ellipse(x, y, w/1.5, w/3, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = color; ctx.fillRect(x - w/2, y - h, w, h*0.6);
    ctx.fillStyle = 'white'; ctx.fillRect(x - w/2, y - h*0.4, w, h*0.4);
    ctx.fillStyle = '#ffccaa'; ctx.fillRect(x - w*0.3, y - h, w*0.6, h*0.4);
    if (isBatter) {
        ctx.save(); ctx.translate(x, y - h*0.5);
        let rot = -Math.PI/4;
        if (batter.swingTimer > 0) rot = Math.PI/2 - (batter.swingTimer/10 * Math.PI);
        ctx.rotate(rot); ctx.fillStyle = '#d2b48c'; ctx.fillRect(0, -2, h, 4);
        ctx.restore();
    }
}

function drawBall() {
    let scale = 0.5 + ((ball.y - 80) / 140) * 1.5;
    if (scale < 0.1) scale = 0.1;
    let drawY = ball.y - ball.z;
    
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(ball.x, ball.y, 4*scale, 2*scale, 0, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(ball.x, drawY, 3*scale, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = 'red'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(ball.x, drawY, 3*scale, 0, Math.PI*2); ctx.stroke();
}

function loop() {
    frameCount++;
    if (pitchMeter.active) {
        pitchMeter.value += pitchMeter.speed * pitchMeter.dir;
        if (pitchMeter.value > 100 || pitchMeter.value < 0) pitchMeter.dir *= -1;
        document.getElementById('pitch-meter-marker').style.left = pitchMeter.value + '%';
        document.getElementById('pitch-meter-fill').style.width = '100%'; 
    }
    
    if (ball.state === 'pitching' || ball.state === 'hit') {
        ball.x += ball.vx; ball.y += ball.vy; ball.z += ball.vz;
        if (ball.state === 'pitching' && ball.y > 230) {
            ball.state = 'missed';
            if (!gameData.isTop) checkPlayerSwing();
        }
        if (ball.state === 'hit') {
            ball.vz -= 0.1;
            if (ball.z < 0) { ball.z = 0; ball.vz *= -0.6; ball.vx*=0.8; ball.vy*=0.8; }
            
            // Failsafe: If ball goes too far out, end play
            if (ball.y < -3000) finishPlay();
        }
    }
    
    if (!gameData.isTop) batter.x += (input.x - batter.x) * 0.2;
    if (batter.swingTimer > 0) batter.swingTimer--;
    
    updateParticles();
    draw();
    requestAnimationFrame(loop);
}

function handleInput(e) {
    if (e.type === 'touchstart' || e.type === 'mousedown') {
        if (e.target.tagName !== 'BUTTON') { } 
    }
    if (currentState === STATE.MENU || currentState === STATE.GAMEOVER) return;
    if (!gameData.isTop) {
        if (currentState === STATE.BATTING_WAIT) { batter.swingTimer = 10; checkPlayerSwing(); }
    } else handlePitchClick();
}

function updateInputPos(e) {
    if (e.type === 'touchmove') e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    let cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
    let scaleFactor = GAME_WIDTH / rect.width;
    input.x = (cx - rect.left) * scaleFactor;
    if (input.x < 110) input.x = 110;
    if (input.x > 210) input.x = 210;
}

window.addEventListener('mousedown', (e) => { input.clicked = true; handleInput(e); });
window.addEventListener('touchstart', (e) => { if(e.target.tagName !== 'BUTTON') e.preventDefault(); input.clicked = true; handleInput(e); }, {passive: false});
window.addEventListener('mousemove', updateInputPos);
window.addEventListener('touchmove', updateInputPos, {passive: false});

window.onload = function() {
    document.addEventListener('click', function startAudio() { AudioEngine.init(); document.removeEventListener('click', startAudio); }, {once: true});
    showMessage("RETRO DIAMOND", "Welcome to the Big Leagues.<br>Pitch (Top) & Bat (Bottom).<br>9 Innings. Upgrade your team.", "PLAY BALL", resetGame);
    loop();
};
</script>
