<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ritlife - The Sandbox Update</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .fade-in { animation: fadeIn 0.2s ease-out; }
        .bounce-in { animation: bounceIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes bounceIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .bitlife-btn:active { transform: scale(0.98); background-color: #f3f4f6; }
        .bg-stripes-gray { background-image: repeating-linear-gradient(45deg, #e5e7eb, #e5e7eb 10px, #f3f4f6 10px, #f3f4f6 20px); }
    </style>
</head>
<body class="bg-gray-900 h-screen w-full flex justify-center items-center overflow-hidden">

    <div id="root" class="h-full w-full max-w-md bg-white shadow-2xl relative flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- GAME DATA ---
        const COUNTRIES = ["USA", "UK", "Canada", "Australia", "Japan", "France", "Germany", "Brazil", "South Korea", "Spain", "Italy", "Sweden"];
        
        const CAREER_PATHS = {
            Restaurant: [ {title:"Dishwasher",salary:20000,req:"None"}, {title:"Line Cook",salary:35000,req:"None"}, {title:"Sous Chef",salary:55000,req:"None"}, {title:"Exec Chef",salary:100000,req:"None"} ],
            Police: [ {title:"Cadet",salary:35000,req:"High School"}, {title:"Officer",salary:55000,req:"High School"}, {title:"Detective",salary:85000,req:"High School"}, {title:"Chief",salary:160000,req:"High School"} ],
            Medical: [ {title:"Resident",salary:55000,req:"Medical School"}, {title:"Physician",salary:180000,req:"Medical School"}, {title:"Surgeon",salary:350000,req:"Medical School"} ],
            Legal: [ {title:"Paralegal",salary:50000,req:"University"}, {title:"Associate",salary:90000,req:"Law School"}, {title:"Judge",salary:200000,req:"Law School"} ],
            Pilot: [ {title:"Trainee",salary:30000,req:"Pilot School"}, {title:"Captain",salary:150000,req:"Pilot School"} ],
            Model: [ {title:"Foot Model",salary:15000,req:"Modeling School"}, {title:"Supermodel",salary:2000000,req:"Modeling School"} ]
        };

        const SURGERIES = [
            { name: "Botox", cost: 500, risk: 0.05, boost: 5 },
            { name: "Liposuction", cost: 5000, risk: 0.15, boost: 15 },
            { name: "Nose Job", cost: 10000, risk: 0.10, boost: 20 },
            { name: "Face Lift", cost: 15000, risk: 0.20, boost: 25 }
        ];

        const VACATIONS = [
            { name: "Camping Trip", cost: 500, happiness: 10 },
            { name: "Cruise to Mexico", cost: 2000, happiness: 25 },
            { name: "Trip to Paris", cost: 5000, happiness: 40 },
            { name: "Luxury Safari", cost: 15000, happiness: 70 }
        ];

        const FIRST_NAMES_M = ["Liam", "Noah", "Oliver", "James", "Elijah", "William", "Henry", "Lucas", "Benjamin", "Theodore"];
        const FIRST_NAMES_F = ["Olivia", "Emma", "Charlotte", "Amelia", "Ava", "Sophia", "Isabella", "Mia", "Evelyn", "Harper"];
        const LAST_NAMES = ["Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller", "Davis"];
        const HOUSES = [
            { name: "Trailer", price: 25000, upkeep: 500 }, { name: "Tiny Home", price: 60000, upkeep: 1000 },
            { name: "Suburban House", price: 350000, upkeep: 5000 }, { name: "Mansion", price: 2500000, upkeep: 25000 }
        ];

        // --- COMPONENTS ---
        const StatBar = ({ label, value, color }) => (
            <div className="flex-1 flex flex-col items-center">
                <div className="text-[9px] font-bold text-gray-400 uppercase tracking-tighter mb-0.5">{label}</div>
                <div className="w-full h-3 bg-gray-200 rounded-full overflow-hidden border border-gray-300 relative">
                    <div className={`h-full ${color} transition-all duration-500`} style={{ width: `${value}%` }}></div>
                </div>
                <div className="text-[9px] font-bold text-gray-500 mt-0.5">{value}%</div>
            </div>
        );

        const MenuRow = ({ icon, title, subtitle, onClick, rightText, color, disabled }) => (
            <button disabled={disabled} onClick={onClick} className={`w-full flex items-center justify-between p-3.5 bg-white border-b border-gray-100 text-left bitlife-btn ${disabled ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-50'}`}>
                <div className="flex items-center">
                    <div className={`w-9 h-9 rounded-lg flex items-center justify-center text-xl mr-3 shadow-sm ${color || 'bg-gray-100 text-gray-600'}`}>{icon}</div>
                    <div>
                        <div className="font-bold text-gray-800 text-sm leading-tight">{title}</div>
                        {subtitle && <div className="text-xs text-gray-500 font-medium">{subtitle}</div>}
                    </div>
                </div>
                {rightText && <div className="text-xs font-bold text-gray-400 uppercase tracking-wide">{rightText} ›</div>}
                {!rightText && <div className="text-gray-300">›</div>}
            </button>
        );

        const Modal = ({ title, children, onClose }) => (
            <div className="absolute inset-0 z-50 bg-black/60 flex items-end sm:items-center justify-center fade-in">
                <div className="bg-gray-100 w-full sm:w-[95%] sm:rounded-2xl h-[85%] sm:h-auto sm:max-h-[90%] flex flex-col shadow-2xl slide-up overflow-hidden">
                    <div className="bg-white px-4 py-3 border-b flex justify-between items-center sticky top-0 z-10">
                        <h2 className="text-lg font-black text-gray-800 uppercase tracking-tight">{title}</h2>
                        <button onClick={onClose} className="bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg text-xs font-bold uppercase transition">Close</button>
                    </div>
                    <div className="overflow-y-auto p-4 space-y-2 flex-1">
                        {children}
                    </div>
                </div>
            </div>
        );

        const Popup = ({ event, onOption }) => (
            <div className="absolute inset-0 z-50 bg-black/70 flex items-center justify-center p-6 fade-in backdrop-blur-sm">
                <div className="bg-white w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden bounce-in">
                    <div className="bg-blue-600 p-4 text-center">
                        <div className="text-4xl mb-2">{event.icon || '💡'}</div>
                        <h3 className="text-white font-black text-xl uppercase tracking-wide">{event.title}</h3>
                    </div>
                    <div className="p-6 text-center">
                        <p className="text-gray-700 font-medium text-lg leading-snug mb-6">{event.description}</p>
                        <div className="space-y-3">
                            {event.options.map((opt, i) => (
                                <button key={i} onClick={() => onOption(opt)} className="w-full py-3.5 px-4 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold rounded-xl border-b-4 border-gray-300 active:border-b-0 active:translate-y-1 transition-all text-sm">
                                    {opt.label}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        );

        // --- MAIN COMPONENT ---

        function Ritlife() {
            const [gameState, setGameState] = useState("menu");
            const [age, setAge] = useState(0);
            const [name, setName] = useState("");
            const [money, setMoney] = useState(0);
            const [stats, setStats] = useState({ happiness: 90, health: 90, smarts: 50, looks: 50, fame: 0 });
            const [logs, setLogs] = useState([]);
            
            // Player Data
            const [gender, setGender] = useState("Male");
            const [country, setCountry] = useState("USA");
            const [job, setJob] = useState(null); 
            const [salary, setSalary] = useState(0); 
            const [education, setEducation] = useState("None");
            const [currentSchool, setCurrentSchool] = useState(null);
            const [studyYearsLeft, setStudyYearsLeft] = useState(0);
            
            // Lists & Systems
            const [assets, setAssets] = useState({ houses: [] }); 
            const [relationships, setRelationships] = useState([]);
            const [yearlyActions, setYearlyActions] = useState({});
            const [generation, setGeneration] = useState(1);
            const [ancestors, setAncestors] = useState([]);
            
            // UI
            const [tab, setTab] = useState("life");
            const [modal, setModal] = useState(null);
            const [currentEvent, setCurrentEvent] = useState(null);
            const [selectedPerson, setSelectedPerson] = useState(null);
            const logsEndRef = useRef(null);
            
            // Sandbox
            const [sandboxMode, setSandboxMode] = useState(false);
            const [customName, setCustomName] = useState("");

            // --- INIT ---
            const initGame = (isCustom, inheritData = null) => {
                if (inheritData) {
                    setName(inheritData.name);
                    setGender(inheritData.gender);
                    setAge(inheritData.age);
                    setMoney(inheritData.money);
                    setAssets(inheritData.assets);
                    setGeneration(g => g + 1);
                    setAncestors(prev => [...prev, { name, age, netWorth: money, job: job?.title || "Unemployed" }]);
                    
                    setStats({ happiness: 90, health: 100, smarts: 50, looks: 50, fame: 0 });
                    setEducation(inheritData.age >= 6 ? (inheritData.age >= 18 ? "High School" : "Elementary") : "None");
                    setJob(null); setSalary(0); setCurrentSchool(null); setStudyYearsLeft(0);
                    setRelationships([{id:Date.now(), name: name, age: age+20, relation: gender==="Male"?"Father":"Mother", bar:100}]);
                    setLogs([{age: inheritData.age, text: `👶 Continued life as ${inheritData.name}.`}]);
                } else {
                    const g = isCustom ? (document.getElementById('customGen').value) : (Math.random() > 0.5 ? "Male" : "Female");
                    const c = isCustom ? (document.getElementById('customCtry').value) : COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)];
                    let fName = "Alex", lName = "Smith";
                    
                    if (isCustom && customName) { const parts = customName.split(' '); fName = parts[0]; lName = parts[1] || ""; }
                    else { fName = g==="Male" ? FIRST_NAMES_M[Math.floor(Math.random()*FIRST_NAMES_M.length)] : FIRST_NAMES_F[Math.floor(Math.random()*FIRST_NAMES_F.length)]; lName = LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)]; }

                    setName(`${fName} ${lName}`); setGender(g); setCountry(c); setAge(0);
                    setMoney(0);
                    setStats({ happiness: 90, health: 90, smarts: Math.floor(Math.random()*60)+20, looks: Math.floor(Math.random()*60)+20, fame: 0 });
                    
                    setJob(null); setSalary(0); setEducation("None"); setCurrentSchool(null); setStudyYearsLeft(0);
                    setRelationships([
                        {id:1, name:`Mother ${lName}`, age:25, relation:"Mother", gender:"Female", bar:90}, 
                        {id:2, name:`Father ${lName}`, age:28, relation:"Father", gender:"Male", bar:90}
                    ]);
                    setAssets({houses:[]}); setGeneration(1); setAncestors([]);
                    setLogs([{age:0, text: `👶 Born in ${c}.`}]);
                }
                setGameState("playing");
            };

            const addLog = (text) => setLogs(p => [...p, {age, text}]);
            const updateStat = (k, v) => setStats(p => ({...p, [k]: Math.max(0, Math.min(100, p[k]+v))}));
            const updateRel = (id, val) => setRelationships(p => p.map(r => r.id===id ? {...r, bar:Math.max(0,Math.min(100,r.bar+val))} : r));
            const checkLimit = (key, max) => {
                if ((yearlyActions[key] || 0) >= max) { addLog("⏳ You've done that enough this year."); return false; }
                setYearlyActions(p => ({...p, [key]: (p[key]||0)+1})); return true;
            };

            const triggerEvent = (evt) => setCurrentEvent(evt);
            const handleEventOption = (opt) => { if(opt.action) opt.action(); setCurrentEvent(null); };

            // --- AGE UP ---
            const handleAgeUp = () => {
                if (currentEvent) return; 
                if (gameState === 'dead') return;
                const nextAge = age + 1;
                setAge(nextAge);
                setYearlyActions({});
                let newLogs = [];

                if (currentSchool) {
                    setStudyYearsLeft(p => p - 1);
                    if (studyYearsLeft - 1 <= 0) { newLogs.push(`🎓 Graduated from ${currentSchool}!`); setEducation(currentSchool); setCurrentSchool(null); }
                } else if (nextAge===18) newLogs.push("🎓 Graduated High School.");

                let income = job ? salary : 0;
                setMoney(m => m + income);
                if (income > 0) newLogs.push(`💸 Income: $${income.toLocaleString()}`);

                // Interactive Events
                if (Math.random() > 0.7) {
                    let evts = [];
                    if(nextAge<18) evts.push({title:"School Bully", icon:"👊", description:"A bully wants your lunch money.", options:[{label:"Give it", action:()=>{updateStat('happiness',-10); addLog("Gave lunch money.");}},{label:"Attack", action:()=>{if(stats.smarts>40){updateStat('happiness',10); addLog("Beat up the bully!");}else{updateStat('health',-10); addLog("Got beaten up.");}}}]});
                    if(nextAge>=18) evts.push({title:"Found Wallet", icon:"👛", description:`Found a wallet with $${nextAge*10}.`, options:[{label:"Keep", action:()=>{setMoney(m=>m+(nextAge*10)); addLog(`Kept $${nextAge*10}.`);}},{label:"Return", action:()=>{updateStat('happiness',10); addLog("Returned wallet.");}}]});
                    if(evts.length > 0) triggerEvent(evts[Math.floor(Math.random()*evts.length)]);
                } else if (Math.random() > 0.5) newLogs.push("🎲 Uneventful year.");

                // Relationship Aging
                setRelationships(prev => prev.map(r => {
                    const newAge = r.age + 1;
                    if (newAge > 85 && Math.random() > 0.85 && !r.dead) { newLogs.push(`⚰️ ${r.name} (${r.relation}) died.`); updateStat('happiness', -30); return {...r, age: newAge, dead: true}; }
                    return {...r, age: newAge};
                }));

                if (stats.health <= 0 || nextAge > 100) { setGameState('dead'); newLogs.push("💀 You died."); }
                newLogs.forEach(l => setLogs(p => [...p, {age: nextAge, text: l}]));
            };

            // --- RELATIONSHIPS ---
            const openInteraction = (person) => {
                if (person.dead) return;
                setSelectedPerson(person);
                setModal('interaction');
            };

            const handleInteract = (action) => {
                if (!selectedPerson) return;
                const id = selectedPerson.id;
                
                if (action === 'time') {
                    if (!checkLimit('interact', 5)) return;
                    addLog(`Spent time with ${selectedPerson.name}.`); updateRel(id, 10); updateStat('happiness', 5);
                } else if (action === 'talk') { addLog(`Talked to ${selectedPerson.name}.`); updateRel(id, 5); }
                else if (action === 'gift') { if(money<100){addLog("❌ Can't afford.");return;} setMoney(m=>m-100); addLog(`Gave gift.`); updateRel(id, 25); }
                else if (action === 'propose') {
                    if (age < 18) { addLog("❌ Too young to propose."); return; } // AGE CAP
                    if (money < 2000) { addLog("❌ Can't afford ring."); return; }
                    if (selectedPerson.bar > 80) { addLog(`💍 Engaged to ${selectedPerson.name}!`); setMoney(m => m - 2000); setRelationships(p => p.map(r => r.id===id ? {...r, relation:"Spouse"} : r)); updateStat('happiness', 50); } 
                    else { addLog(`❌ They said no.`); updateRel(id, -30); updateStat('happiness', -20); }
                }
                setModal(null);
            };

            const handleDatingApp = () => {
                if (age < 14) { addLog("❌ Must be at least 14 to date."); return; } // AGE CAP
                if (age >= 18 && money < 100) { addLog("❌ App costs $100."); return; }
                if (age >= 18) setMoney(m => m - 100);
                
                const pGender = Math.random() > 0.5 ? "Female" : "Male";
                const pName = pGender === "Female" ? FIRST_NAMES_F[Math.floor(Math.random()*FIRST_NAMES_F.length)] : FIRST_NAMES_M[Math.floor(Math.random()*FIRST_NAMES_M.length)];
                
                // Age Logic: 14-17 get peers. 18+ get adults.
                let partnerAge = age >= 18 ? age + Math.floor(Math.random()*10) - 4 : age + Math.floor(Math.random()*3) - 1;
                partnerAge = Math.max(14, partnerAge); 

                const partner = { id: Date.now(), name: `${pName} ${LAST_NAMES[Math.floor(Math.random()*LAST_NAMES.length)]}`, age: partnerAge, relation: "Partner", bar: 50, gender: pGender };
                
                triggerEvent({
                    title: "Match Found!", icon: "💘", description: `You met ${partner.name} (Age ${partner.age}).`,
                    options: [
                        { label: "Date Them", action: () => { setRelationships(p => [...p, partner]); addLog(`Started dating ${partner.name}.`); updateStat('happiness', 10); } },
                        { label: "Reject", action: () => addLog("Rejected match.") }
                    ]
                });
            };

            // --- ACTIVITIES ---
            const handleEmigrate = (newCountry) => {
                if (age < 18) { addLog("❌ Must be 18 to emigrate."); return; } // AGE CAP
                if (money < 5000) { addLog("❌ Costs $5,000."); return; }
                setMoney(m => m - 5000); setCountry(newCountry); addLog(`✈️ Emigrated to ${newCountry}.`); setModal(null);
            };

            const handleOutdoor = (act) => {
                if (age < 18) { addLog("❌ Must be 18+ for dangerous outdoor activities."); return; } // AGE CAP
                addLog(`🌲 Went ${act}.`); updateStat('happiness', 15);
                if (Math.random() > 0.8) { addLog("🤕 Injured outside!"); updateStat('health', -20); }
            };

            const handleJobApply = (cat, index) => {
                if (age < 18) { addLog("❌ Must be 18 for full-time jobs."); return; } // AGE CAP
                if (index > 0) { addLog("❌ Must apply for Entry Level positions first."); return; }
                const j = CAREER_PATHS[cat][index];
                let qualified = true;
                if (j.req === "University" && !education.includes("University")) qualified = false;
                if (j.req === "Medical School" && !education.includes("Medical")) qualified = false;
                if (j.req === "Law School" && !education.includes("Law")) qualified = false;
                
                if (qualified) { setJob({...j, category: cat, tier: index}); setSalary(j.salary); addLog(`💼 Hired as ${j.title}!`); setModal(null); } 
                else addLog(`❌ Rejected. Need ${j.req}.`);
            };

            const handleSchool = (type) => {
                if (age < 18) { addLog("❌ Must be 18 to attend higher education."); return; } // AGE CAP
                if (money < 10000 && type !== 'University') { addLog("❌ Tuition costs $10k."); return; }
                if (type !== 'University') setMoney(m => m - 10000);
                setCurrentSchool(type); setStudyYearsLeft(type === 'University' ? 4 : 2);
                addLog(`🏫 Enrolled in ${type}.`); setModal(null);
            };

            const switchLife = (child) => {
                if (age <= child.age) return;
                const confirmSwitch = window.confirm(`Surrender your current life and continue as ${child.name}?`);
                if (confirmSwitch) initGame(false, { money, assets, name: child.name, gender: child.gender, age: child.age });
            };

            // --- RENDER ---
            useEffect(() => { if (logsEndRef.current) logsEndRef.current.scrollIntoView({ behavior: "smooth" }); }, [logs, tab]);

            if (gameState === 'menu') return (
                <div className="h-full w-full bg-slate-900 flex flex-col items-center justify-center p-6 text-white space-y-6">
                    <h1 className="text-6xl font-black text-yellow-400 tracking-tighter">RITLIFE</h1>
                    <h2 className="text-xl font-bold text-pink-400 -mt-4 mb-2">The Sandbox Update</h2>
                    <div className="w-full max-w-xs space-y-3 bg-slate-800 p-6 rounded-2xl border border-slate-700">
                        <input type="text" placeholder="Custom Name" className="w-full p-3 rounded bg-slate-700 text-white outline-none" value={customName} onChange={e=>setCustomName(e.target.value)} />
                        <div className="flex gap-2">
                            <select id="customGen" className="flex-1 p-3 rounded bg-slate-700 text-white"><option value="Male">Male</option><option value="Female">Female</option></select>
                            <select id="customCtry" className="flex-1 p-3 rounded bg-slate-700 text-white">{COUNTRIES.map(c=><option key={c}>{c}</option>)}</select>
                        </div>
                        <label className="flex items-center gap-3 p-2 bg-slate-700/50 rounded cursor-pointer"><input type="checkbox" className="w-5 h-5 accent-yellow-400" checked={sandboxMode} onChange={e=>setSandboxMode(e.target.checked)}/> Sandbox Editor</label>
                        <div className="pt-2 flex flex-col gap-2">
                            <button onClick={()=>initGame(true)} className="w-full py-3 bg-blue-600 rounded-xl font-bold">Custom Life</button>
                            <button onClick={()=>initGame(false)} className="w-full py-3 bg-green-600 rounded-xl font-bold">Random Life</button>
                        </div>
                    </div>
                </div>
            );

            if (gameState === 'dead') return <div className="h-full w-full bg-black flex flex-col items-center justify-center p-6 text-white text-center"><h1 className="text-6xl mb-4">🪦</h1><h2 className="text-4xl font-black mb-2">R.I.P.</h2><p className="text-gray-400 mb-8">{name} died at age {age}.</p><button onClick={()=>setGameState('menu')} className="bg-white text-black px-8 py-3 rounded-full font-bold">Main Menu</button></div>;

            return (
                <div className="h-full flex flex-col bg-gray-100 font-sans">
                    {currentEvent && <Popup event={currentEvent} onOption={handleEventOption} />}

                    <div className="bg-white px-4 py-3 flex justify-between items-center shadow-sm z-20 border-b border-gray-200">
                        <div className="flex items-center gap-2">
                            <button onClick={() => setModal('tree')} className="text-xl hover:bg-gray-100 p-1 rounded transition" title="Family Tree">🌳</button>
                            {sandboxMode && <button onClick={() => setModal('editor')} className="text-xl hover:bg-yellow-50 p-1 rounded transition" title="Sandbox Editor">✏️</button>}
                            <div className="flex flex-col ml-1">
                                <span className="font-black text-gray-800 text-lg leading-none">{name}</span>
                                <span className="text-xs text-gray-500 font-medium">{job ? job.title : "Unemployed"} • {age}y</span>
                            </div>
                        </div>
                        <div className="text-green-600 font-black text-lg">${money.toLocaleString()}</div>
                    </div>

                    <div className="bg-white px-4 py-2 flex gap-2 border-b shadow-sm z-10">
                        <StatBar label="Happiness" value={stats.happiness} color="bg-green-500" />
                        <StatBar label="Health" value={stats.health} color="bg-rose-500" />
                        <StatBar label="Smarts" value={stats.smarts} color="bg-blue-500" />
                        <StatBar label="Looks" value={stats.looks} color="bg-orange-500" />
                    </div>

                    <div className="flex-1 overflow-y-auto bg-gray-50 relative">
                        {tab === 'life' && (
                            <div className="p-4 pb-32 space-y-2">
                                {logs.map((l, i) => <div key={i} className="flex gap-3 text-sm text-gray-800 border-b pb-2"><div className="font-bold text-gray-400 min-w-[24px] text-right">{l.age}</div><div className="flex-1">{l.text}</div></div>)}
                                <div ref={logsEndRef} />
                            </div>
                        )}

                        {tab === 'occupation' && (
                            <div className="pb-32">
                                <div className="p-4 text-xs font-bold text-gray-400 uppercase">Current</div>
                                {job ? <><MenuRow icon="💼" title={job.title} subtitle={`$${salary.toLocaleString()}`} /><MenuRow icon="🚪" title="Quit Job" onClick={()=>{setJob(null);setSalary(0);addLog("Quit job.");}} color="bg-red-100 text-red-600" /></> : <div className="px-4 py-8 text-center text-gray-400 italic bg-white">Unemployed</div>}
                                <div className="p-4 text-xs font-bold text-gray-400 uppercase mt-2">Careers</div>
                                {!currentSchool && <><MenuRow icon="🎓" title="University" onClick={()=>handleSchool('University')} /><MenuRow icon="🏥" title="Medical School" onClick={()=>handleSchool('Medical School')} /><MenuRow icon="⚖️" title="Law School" onClick={()=>handleSchool('Law School')} /></>}
                                <MenuRow icon="👔" title="Full-time Jobs" subtitle="Entry Level Only (18+)" onClick={()=>setModal('careers')} color="bg-green-100 text-green-600" />
                            </div>
                        )}

                        {tab === 'relationships' && (
                            <div className="pb-32">
                                <div className="p-4 text-xs font-bold text-gray-400 uppercase">My Relationships</div>
                                {relationships.map(r => (
                                    <MenuRow key={r.id} icon={r.dead ? "⚰️" : (r.gender==="Female"?"👩":"👨")} title={r.name} subtitle={`${r.relation} • Age ${r.age}`} rightText={`${r.bar}%`} onClick={()=>openInteraction(r)} disabled={r.dead} />
                                ))}
                                <MenuRow icon="💘" title="Dating App" subtitle="Find a partner (14+)" onClick={handleDatingApp} color="bg-pink-100 text-pink-600" />
                            </div>
                        )}

                        {tab === 'activities' && (
                            <div className="pb-32">
                                <div className="p-4 text-xs font-bold text-gray-400 uppercase">Self Care</div>
                                <MenuRow icon="💉" title="Plastic Surgery" subtitle="Nip & Tuck (18+)" onClick={()=>{if(age<18){addLog("Too young.");return;} setModal('surgery');}} color="bg-rose-100 text-rose-600" />
                                <MenuRow icon="💇" title="Salon & Spa" subtitle="Treat yourself" onClick={()=>{if(money>=100){setMoney(m=>m-100);updateStat('happiness',10);updateStat('looks',2);addLog("Went to spa.");}else addLog("Too poor.");}} color="bg-pink-100 text-pink-600" />
                                <MenuRow icon="🏋️" title="Gym" onClick={()=>{updateStat('health',2);updateStat('looks',1);addLog("Gym.");}} color="bg-orange-100 text-orange-600" />
                                
                                <div className="p-4 text-xs font-bold text-gray-400 uppercase mt-2">Entertainment & Crime</div>
                                <MenuRow icon="✈️" title="Emigrate" subtitle="Move Countries (18+)" onClick={()=>setModal('emigrate')} color="bg-blue-100 text-blue-600" />
                                <MenuRow icon="⛰️" title="Outdoor" subtitle="Hiking, Exploring (18+)" onClick={()=>setModal('outdoor')} color="bg-green-100 text-green-600" />
                                <MenuRow icon="🎰" title="Casino" subtitle="Gamble (21+)" onClick={()=>{if(age<21){addLog("Too young");return;} if(money>=100){setMoney(m=>m-100); if(Math.random()>0.5){setMoney(m=>m+200);addLog("Won $200");}else addLog("Lost $100");}}} color="bg-yellow-100 text-yellow-600" />
                                <MenuRow icon="🔪" title="Crime" subtitle="Robbery (10+)" onClick={()=>{if(age<10){addLog("Too young");return;} if(Math.random()>0.7){setMoney(m=>m+500);addLog("Stole $500.");}else{addLog("Caught! Prison.");setGameState('prison');setPrisonYears(2);}}} color="bg-gray-800 text-white" />
                            </div>
                        )}
                        
                        {tab === 'assets' && (
                            <div className="pb-32">
                                <div className="p-4 text-xs font-bold text-gray-400 uppercase">Real Estate</div>
                                {assets.houses.length===0 && <div className="p-4 text-gray-400 italic text-sm">None</div>}
                                {assets.houses.map((h, i) => <MenuRow key={i} icon="🏠" title={h.name} />)}
                                <MenuRow icon="➕" title="Real Estate Brokers" subtitle="(18+)" onClick={()=>{if(age<18){addLog("Too young");return;}setModal('realestate');}} color="bg-green-100 text-green-600" />
                            </div>
                        )}
                    </div>

                    <div className="absolute bottom-20 left-0 right-0 flex justify-center pointer-events-none z-20">
                        <button onClick={handleAgeUp} className="bg-green-500 pointer-events-auto text-white w-20 h-20 rounded-full shadow-2xl flex items-center justify-center border-4 border-white active:scale-95 transition-transform hover:scale-105 hover:bg-green-400">
                            <span className="font-black text-2xl drop-shadow-md">+</span>
                        </button>
                    </div>

                    <div className="bg-white border-t border-gray-200 h-16 flex justify-around items-center z-20 pb-safe">
                        {['life','occupation','relationships','activities','assets'].map(t => (
                            <button key={t} onClick={()=>setTab(t)} className={`flex-1 flex flex-col items-center justify-center h-full ${tab===t ? 'text-green-600' : 'text-gray-400 hover:text-gray-600'}`}>
                                <span className="text-xl mb-0.5 capitalize">{t==='life'?'⚡':t==='occupation'?'💼':t==='assets'?'💎':t==='relationships'?'❤️':'🧸'}</span>
                                <span className="text-[9px] font-bold uppercase tracking-wide">{t.substring(0,4)}</span>
                            </button>
                        ))}
                    </div>

                    {/* MODALS */}
                    {modal === 'careers' && <Modal title="Jobs" onClose={()=>setModal(null)}>{Object.keys(CAREER_PATHS).map(cat => <div key={cat}><div className="text-xs font-bold text-gray-400 uppercase mt-2">{cat}</div>{CAREER_PATHS[cat].map((j,i)=><MenuRow key={i} icon="👔" title={j.title} subtitle={`$${j.salary}`} rightText="Apply" onClick={()=>handleJobApply(cat,i)}/>)}</div>)}</Modal>}
                    {modal === 'surgery' && <Modal title="Plastic Surgery" onClose={()=>setModal(null)}>{SURGERIES.map(s=><MenuRow key={s.name} icon="💉" title={s.name} subtitle={`$${s.cost}`} rightText="Do it" onClick={()=>{if(money>=s.cost){setMoney(m=>m-s.cost);updateStat('looks',s.boost);addLog(`Did ${s.name}`);setModal(null);}else addLog("Too poor");}}/>)}</Modal>}
                    {modal === 'realestate' && <Modal title="Real Estate" onClose={()=>setModal(null)}>{HOUSES.map(h=><MenuRow key={h.name} icon="🏠" title={h.name} subtitle={`$${h.price}`} rightText="Buy" onClick={()=>{if(money>=h.price){setMoney(m=>m-h.price);setAssets(p=>({...p,houses:[...p.houses,h]}));addLog(`Bought ${h.name}`);setModal(null);}else addLog("Too poor");}}/>)}</Modal>}
                    
                    {modal === 'emigrate' && (
                        <Modal title="Emigrate" onClose={()=>setModal(null)}>
                            {COUNTRIES.map(c => c!==country && <MenuRow key={c} icon="✈️" title={c} subtitle="Cost: $5,000" onClick={()=>{setMoney(m=>m-5000);setCountry(c);addLog(`Moved to ${c}.`);setModal(null);}} />)}
                        </Modal>
                    )}

                    {modal === 'outdoor' && (
                        <Modal title="Outdoor Activities" onClose={()=>setModal(null)}>
                            <MenuRow icon="🚙" title="Mudding" onClick={()=>{addLog("Went mudding.");updateStat('happiness',5);setModal(null);}} />
                            <MenuRow icon="🔦" title="Cave Diving" onClick={()=>{if(Math.random()>0.9){setGameState('dead');addLog("Died in cave.");}else{addLog("Cave dive survived.");updateStat('happiness',15);}setModal(null);}} />
                        </Modal>
                    )}

                    {/* SANDBOX EDITOR */}
                    {modal === 'editor' && (
                        <Modal title="Sandbox Editor" onClose={() => setModal(null)}>
                            <div className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold uppercase text-gray-500">Bank Balance</label>
                                    <input type="number" value={money} onChange={e=>setMoney(Number(e.target.value))} className="w-full p-2 border rounded"/>
                                </div>
                                {Object.keys(stats).map(k => (
                                    <div key={k}>
                                        <div className="flex justify-between text-xs font-bold uppercase text-gray-500"><span>{k}</span><span>{stats[k]}%</span></div>
                                        <input type="range" className="w-full accent-yellow-500" value={stats[k]} onChange={e=>{
                                            const val = Number(e.target.value);
                                            const delta = val - stats[k];
                                            updateStat(k, delta);
                                        }}/>
                                    </div>
                                ))}
                            </div>
                        </Modal>
                    )}

                    {/* FAMILY TREE */}
                    {modal === 'tree' && (
                        <Modal title="Family Tree" onClose={() => setModal(null)}>
                            <div className="text-center p-4 bg-gray-200 rounded mb-4">
                                <div className="text-4xl">👶</div>
                                <div className="font-bold text-lg">{name}</div>
                                <div className="text-xs text-gray-500">Generation {generation}</div>
                            </div>
                            <div className="space-y-2">
                                <div className="text-xs font-bold uppercase text-gray-400">Ancestors</div>
                                {ancestors.length===0 && <div className="text-sm italic text-gray-500">None</div>}
                                {ancestors.map((a, i) => (
                                    <div key={i} className="flex justify-between p-3 bg-white border rounded">
                                        <div><div className="font-bold">{a.name}</div><div className="text-xs text-gray-500">{a.job}</div></div>
                                        <div className="text-sm text-green-500 font-bold">${a.netWorth.toLocaleString()}</div>
                                    </div>
                                ))}
                            </div>
                        </Modal>
                    )}

                    {/* RELATIONSHIP INTERACTION + EDITOR */}
                    {modal === 'interaction' && selectedPerson && (
                        <Modal title={selectedPerson.name} onClose={()=>setModal(null)}>
                            <div className="text-center p-4 bg-gray-100 rounded mb-4">
                                <div className="text-4xl mb-2">{selectedPerson.gender==="Female"?"👩":"👨"}</div>
                                <div className="font-bold text-xl">{selectedPerson.name}</div>
                                <div className="text-sm text-gray-500">{selectedPerson.relation} • Age {selectedPerson.age}</div>
                                <div className="mt-2 text-xs font-bold text-pink-500 uppercase">Relationship: {selectedPerson.bar}%</div>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                <button className="p-3 bg-blue-100 text-blue-700 rounded font-bold" onClick={()=>handleInteract('time')}>Spend Time</button>
                                <button className="p-3 bg-green-100 text-green-700 rounded font-bold" onClick={()=>handleInteract('talk')}>Converse</button>
                                <button className="p-3 bg-purple-100 text-purple-700 rounded font-bold" onClick={()=>handleInteract('gift')}>Gift ($100)</button>
                                <button className="p-3 bg-red-100 text-red-700 rounded font-bold" onClick={()=>handleInteract('insult')}>Insult</button>
                                {selectedPerson.relation === 'Partner' && <button className="col-span-2 p-3 bg-pink-100 text-pink-700 rounded font-bold border-2 border-pink-200" onClick={()=>handleInteract('propose')}>💍 Propose</button>}
                                {selectedPerson.relation === 'Child' && age > selectedPerson.age && <button className="col-span-2 p-3 bg-indigo-100 text-indigo-700 rounded font-bold border-2 border-indigo-200" onClick={()=>switchLife(selectedPerson)}>🔄 Switch to Life</button>}
                            </div>
                            
                            {/* Sandbox Relationship Editor */}
                            {sandboxMode && (
                                <div className="mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded">
                                    <div className="text-xs font-bold text-yellow-700 uppercase mb-2">Sandbox: Edit Relation</div>
                                    <input type="range" min="0" max="100" value={selectedPerson.bar} className="w-full accent-yellow-500" 
                                        onChange={(e) => {
                                            const val = Number(e.target.value);
                                            updateRel(selectedPerson.id, val - selectedPerson.bar);
                                            setSelectedPerson(p => ({...p, bar: val}));
                                        }} 
                                    />
                                    <button onClick={()=>{updateRel(selectedPerson.id, 100-selectedPerson.bar); setSelectedPerson(p=>({...p, bar:100}));}} className="w-full mt-2 p-2 bg-yellow-200 text-yellow-800 font-bold rounded text-sm">Max Relationship</button>
                                </div>
                            )}
                        </Modal>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Ritlife />);
    </script>
</body>
</html>
